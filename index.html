<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Block">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#0B0B0C">
<title>Block</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#0B0B0C;
  --s1:#141416;          /* card */
  --s2:#1C1C1F;          /* raised inside card */
  --s0:#0F0F11;          /* inset / track */
  --nav-bg:#161618;
  --line:#26262A;
  --line-hi:#37373D;
  --ink:#EDE7DA;         /* beige */
  --ink-2:#A39C8D;
  --ink-3:#77726A;
  --dim:#77726A;
  --amber:#FF8A1E;       /* primary accent */
  --amber-2:#B4600F;
  --amber-soft:rgba(255,138,30,.10);
  --amber-glow:rgba(255,138,30,.28);
  --run:#6FA8B5;         /* muted teal — running */
  --run-soft:rgba(111,168,181,.12);
  --lift:#C2A25A;        /* brass — strength */
  --lift-soft:rgba(194,162,90,.12);
  --green:#E0D7C4;       /* light beige — second chart tone */
  --red:#D2603F;         /* warm brick, warnings only */
  --blue:#A29A8C;
  --violet:#6C665D;
  --serif:"Fraunces",Georgia,serif;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --gut:18px;
  --r:20px;
  --e:cubic-bezier(.32,.72,.28,1);
}
[data-theme="light"]{
  color-scheme:light;
  --bg:#E9E3D6; --s1:#F7F3EA; --s2:#F0EBDE; --s0:#DED7C6; --nav-bg:#F7F3EA;
  --line:#D5CDBB; --line-hi:#BCB3A0;
  --ink:#16161A; --ink-2:#4E4A42; --ink-3:#7C766B; --dim:#7C766B;
  --amber:#B35A00; --amber-2:#8A4500; --amber-soft:rgba(179,90,0,.10); --amber-glow:rgba(179,90,0,.20);
  --run:#2F6F7E; --run-soft:rgba(47,111,126,.12);
  --lift:#8A6A1C; --lift-soft:rgba(138,106,28,.12);
  --green:#8A8272; --red:#B0442A; --blue:#6F6A60; --violet:#403C36;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{
  background:var(--bg);color:var(--ink);
  font-family:var(--sans);font-size:15px;line-height:1.6;letter-spacing:-.005em;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;
  transition:background .35s var(--e),color .35s var(--e);
}
button,input,select,textarea{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;font-family:var(--sans)}
::selection{background:var(--amber);color:var(--bg)}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px;border-radius:10px}

h1{font-family:var(--serif);font-size:34px;font-weight:600;line-height:1.08;letter-spacing:-.028em;
  font-variation-settings:"opsz" 96}
h2{font-family:var(--serif);font-size:21px;font-weight:600;line-height:1.2;letter-spacing:-.018em;
  font-variation-settings:"opsz" 36}
h3{font-family:var(--serif);font-size:17px;font-weight:600;line-height:1.3;letter-spacing:-.01em}
.tag{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.sm{font-size:13.5px} .xs{font-size:12.5px}
.d2{color:var(--ink-2)} .d3{color:var(--dim)} .amb{color:var(--amber)}
.rn{color:var(--run)} .lf{color:var(--lift)}

#app{max-width:460px;margin:0 auto;min-height:100dvh}
main{padding:0 var(--gut) calc(104px + env(safe-area-inset-bottom))}

/* ── header ────────────────────────────────────────────── */
.hdr{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:11px;
  padding:calc(env(safe-area-inset-top) + 14px) var(--gut) 12px;
  background:linear-gradient(var(--bg) 68%,transparent)}
.daychip{flex:0 0 auto;width:44px;height:44px;border-radius:15px;background:var(--s1);
  border:1px solid var(--line);display:grid;place-items:center;line-height:1;position:relative;overflow:hidden}
.daychip b{font-family:var(--serif);font-size:19px;font-weight:600;letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;display:block}
.daychip i{position:absolute;left:0;bottom:0;height:2px;background:var(--amber);width:0;
  transition:width .8s var(--e)}
.hdr .mark{font-family:var(--serif);font-size:18px;font-weight:600;letter-spacing:-.02em;flex:1;min-width:0}
.hdr .mark i{font-style:normal;color:var(--amber)}
.hdr .mark span{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--dim);margin-top:3px;font-weight:500;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:38px;height:38px;border-radius:50%;background:var(--s1);border:1px solid var(--line);
  display:grid;place-items:center;color:var(--ink-2);flex:0 0 auto;transition:.2s var(--e)}
.ib:active{transform:scale(.9);color:var(--amber);border-color:var(--amber-2)}
.ib svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
.ib.sm2{width:32px;height:32px}
.ib.sm2 svg{width:14px;height:14px}
.ib[disabled]{opacity:.3}

.view{display:none}
.view.on{display:block;animation:vin .34s var(--e)}
@keyframes vin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ── hero ──────────────────────────────────────────────── */
.hero{padding:4px 0 2px}
.metarow{display:flex;align-items:center;gap:9px;margin-bottom:14px}
.metarow .dot{width:3px;height:3px;border-radius:50%;background:var(--line-hi);flex:0 0 auto}
.pillbadge{font-family:var(--mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;font-weight:500;
  padding:4px 10px;border-radius:99px;background:var(--amber-soft);color:var(--amber);
  border:1px solid var(--amber-2);white-space:nowrap}
.pillbadge.rn{background:var(--run-soft);color:var(--run);border-color:var(--run)}
.datechip{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:99px;
  background:var(--s1);border:1px solid var(--line);font-family:var(--mono);font-size:11px;
  font-weight:500;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2);
  cursor:pointer;white-space:nowrap;transition:.2s var(--e)}
.datechip:active{border-color:var(--amber);color:var(--amber)}
.datechip svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto;opacity:.7}
.datechip.back{background:var(--amber-soft);border-color:var(--amber-2);color:var(--amber)}
.datechip.back svg{opacity:1}
.datehide{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;border:0;
  opacity:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.lead{font-family:var(--serif);font-size:25px;line-height:1.36;font-weight:400;letter-spacing:-.016em;
  font-variation-settings:"opsz" 48}
.lead b{font-weight:600;color:var(--amber)}
.leadwrap{position:relative;padding-left:17px;margin:2px 0 4px;animation:lead .55s var(--e)}
.leadwrap::before{content:"";position:absolute;left:0;top:4px;bottom:4px;width:3px;border-radius:99px;
  background:linear-gradient(var(--amber),var(--amber-2))}
@keyframes lead{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}

.notes{margin-top:16px;display:flex;flex-direction:column;gap:10px}
.note{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:12px 14px;
  font-size:13.5px;line-height:1.55;color:var(--ink-2)}
.note b{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--dim);margin-bottom:5px;font-weight:500}
.note.warn{border-color:rgba(210,96,63,.32);background:rgba(210,96,63,.05);color:var(--ink)}
.note.warn b{color:var(--red)}
.note.good{border-color:var(--run);background:var(--run-soft)}
.note.good b{color:var(--run)}

/* ── section head ──────────────────────────────────────── */
.sh{display:flex;align-items:center;gap:12px;margin:32px 0 0}
.sh h2{flex:0 0 auto}
.sh .rule{flex:1;height:1px;background:var(--line)}
.sh .r{flex:0 0 auto;font-family:var(--mono);font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}

/* ── card ──────────────────────────────────────────────── */
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);margin-top:14px;
  overflow:hidden;box-shadow:0 1px 0 rgba(255,255,255,.03) inset}
[data-theme="light"] .card{box-shadow:0 1px 2px rgba(30,26,14,.05)}
.pad{padding:17px}

/* ── session rows ──────────────────────────────────────── */
.sess{margin-top:14px;border-radius:var(--r);overflow:hidden;background:var(--s1);
  border:1px solid var(--line)}
.srow{display:flex;align-items:center;gap:14px;padding:16px 17px;position:relative;
  transition:background .2s var(--e)}
.srow+.srow,.exp+.srow{border-top:1px solid var(--line)}
.srow .accent{position:absolute;left:0;top:0;bottom:0;width:3px;background:transparent}
.srow.isrun .accent{background:var(--run)}
.srow.islift .accent{background:var(--lift)}
.srow.done{background:var(--amber-soft)}
.sbody{flex:1;min-width:0;text-align:left}
.sbody .k{display:flex;align-items:baseline;gap:7px}
.sbody .k b{font-family:var(--serif);font-size:30px;font-weight:600;letter-spacing:-.035em;line-height:1;
  font-variant-numeric:tabular-nums}
.sbody .k i{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.09em;text-transform:uppercase}
.sbody .t{font-size:14.5px;margin-top:7px;line-height:1.4}
.sbody .n{font-size:12.5px;color:var(--dim);margin-top:3px;line-height:1.45}
.srow.done .sbody .t{color:var(--ink-2)}
.tick{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--line-hi);flex:0 0 auto;
  display:grid;place-items:center;background:var(--s0);
  transition:background .3s var(--e),border-color .3s var(--e),transform .3s var(--e),box-shadow .3s}
.tick svg{width:16px;height:16px;stroke:var(--bg);fill:none;stroke-width:3;stroke-linecap:round;
  stroke-linejoin:round;opacity:0;transform:scale(.4);transition:.28s var(--e)}
.done .tick{background:var(--amber);border-color:var(--amber);box-shadow:0 0 0 5px var(--amber-soft)}
.done .tick svg{opacity:1;transform:scale(1)}
.tick.pop{animation:pop .5s var(--e)}
@keyframes pop{0%{transform:scale(1)}38%{transform:scale(1.28)}100%{transform:scale(1)}}
.chev{flex:0 0 auto;color:var(--dim);transition:transform .32s var(--e)}
.chev svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;
  stroke-linejoin:round;display:block}
.isopen .chev{transform:rotate(90deg);color:var(--amber)}

.exp{display:grid;grid-template-rows:0fr;transition:grid-template-rows .36s var(--e)}
.exp.open{grid-template-rows:1fr}
.exp>div{overflow:hidden}
.expin{padding:4px 17px 18px;border-top:1px solid var(--line)}

.ex{display:flex;align-items:center;gap:12px;padding:11px 0}
.ex+.ex{border-top:1px solid var(--line)}
.ex .xb{flex:1;min-width:0}
.ex .xn{font-size:14px;line-height:1.35}
.ex .xd{font-size:12px;color:var(--dim);margin-top:2px;line-height:1.45}
.ex .xr{flex:0 0 auto;font-family:var(--mono);font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums;text-align:right}
.mini{width:30px;height:30px;border-radius:9px;border:1.5px solid var(--line-hi);display:grid;
  place-items:center;color:var(--dim);background:var(--s0);flex:0 0 auto;transition:.22s var(--e)}
.mini.on{background:var(--amber);border-color:var(--amber);color:var(--bg)}
.mini svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.8;
  stroke-linecap:round;stroke-linejoin:round}
.grp{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--lift);
  padding:16px 0 3px;font-weight:600}
.grp.first{padding-top:8px}

/* ── fuel ──────────────────────────────────────────────── */
.fuel{margin-top:14px;background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:18px 17px}
.fr{display:flex;align-items:center;gap:20px}
.ring{position:relative;flex:0 0 112px;width:112px;height:112px}
.ring svg{width:112px;height:112px;transform:rotate(-90deg);display:block}
.ring circle{fill:none;stroke-width:9;stroke-linecap:round}
.ring .trk{stroke:var(--s0)}
.ring .val{stroke:var(--amber);transition:stroke-dashoffset .9s var(--e),stroke .3s;
  filter:drop-shadow(0 0 6px var(--amber-glow))}
.ring .val.over{stroke:var(--red)}
.ring .mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .mid b{font-family:var(--serif);font-size:32px;font-weight:600;letter-spacing:-.04em;
  display:block;line-height:1;font-variant-numeric:tabular-nums}
.ring .mid span{font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);
  display:block;margin-top:6px}
.mac{flex:1;min-width:0;display:flex;flex-direction:column;gap:13px}
.mac .rr{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;margin-bottom:6px}
.mac .rr b{font-family:var(--mono);font-weight:500;font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--s0);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;width:0;transition:width .85s var(--e)}
.bar i.p{background:var(--green)} .bar i.c{background:var(--run)} .bar i.f{background:var(--lift)}

/* ── pillars ───────────────────────────────────────────── */
.pill{display:flex;align-items:center;gap:13px;padding:14px 17px;position:relative;overflow:hidden}
.pill+.pill{border-top:1px solid var(--line)}
.pill.done{background:var(--amber-soft)}
.pb{flex:1;min-width:0}
.pb .pn{font-size:14px;line-height:1.35}
.pb .pd{font-family:var(--mono);font-size:12px;color:var(--dim);margin-top:2px}
.pill .prg{position:absolute;left:0;bottom:0;height:2px;background:var(--amber);width:0;
  transition:width .6s var(--e)}
.stp{display:flex;align-items:center;border:1px solid var(--line-hi);border-radius:11px;overflow:hidden;
  background:var(--s0);flex:0 0 auto}
.stp button{width:36px;height:36px;display:grid;place-items:center;color:var(--ink-2);font-size:18px;
  line-height:1;transition:.15s}
.stp button:active{background:var(--s2);color:var(--amber)}
.stp .v{min-width:52px;text-align:center;font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;
  border-left:1px solid var(--line-hi);border-right:1px solid var(--line-hi);padding:7px 0}
.stp .v b{font-weight:600}

/* ── segmented control ─────────────────────────────────── */
.seg{display:flex;gap:4px;margin-top:16px;padding:4px;background:var(--s0);border:1px solid var(--line);
  border-radius:14px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1;min-width:62px;padding:9px 12px;border-radius:10px;font-size:12.5px;
  color:var(--ink-2);white-space:nowrap;transition:.24s var(--e);font-weight:500}
.seg button[aria-selected="true"]{background:var(--amber);color:#0B0B0C;font-weight:600;
  box-shadow:0 2px 10px var(--amber-glow)}
.seg.feel button[aria-pressed="true"]{background:var(--run);color:#0B0B0C;font-weight:600}

/* ── forms ─────────────────────────────────────────────── */
label.f{display:block;margin-top:15px}
label.f>span{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--dim);margin-bottom:7px;font-weight:500}
input[type=text],input[type=number],input[type=date],select,textarea{
  width:100%;background:var(--s0);border:1.5px solid var(--line);color:var(--ink);border-radius:13px;
  padding:13px 14px;font-family:var(--mono);font-size:16px;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--amber);box-shadow:0 0 0 4px var(--amber-soft)}
input::placeholder{color:var(--dim)}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{
  -webkit-appearance:none;margin:0}
input[type=date]{-webkit-appearance:none;appearance:none;min-height:48px}
input[type=date]::-webkit-calendar-picker-indicator{opacity:.5;margin-left:auto}
textarea{resize:vertical;min-height:70px;font-family:var(--sans);font-size:15px}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.r3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.btn{width:100%;background:var(--amber);color:#0B0B0C;border-radius:14px;padding:15px;font-size:14.5px;
  font-weight:600;margin-top:16px;transition:transform .12s var(--e);box-shadow:0 3px 14px var(--amber-glow)}
.btn:active{transform:scale(.98)}
.btn.g{background:transparent;border:1.5px solid var(--line-hi);color:var(--ink-2);font-weight:500;box-shadow:none}
.btn.dg{background:transparent;border:1.5px solid var(--red);color:var(--red);font-weight:500;box-shadow:none}
.btn.lift{background:var(--lift);box-shadow:0 3px 14px var(--lift-soft)}

.quick{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;margin-top:12px}
.quick::-webkit-scrollbar{display:none}
.quick button{flex:0 0 auto;padding:8px 13px;border-radius:99px;border:1px solid var(--line-hi);
  background:var(--s1);font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.quick button:active{border-color:var(--amber);color:var(--amber)}

.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}
.chips button{padding:7px 12px;border-radius:99px;background:var(--s0);border:1px solid var(--line-hi);
  font-family:var(--mono);font-size:12px;color:var(--ink-2)}
.chips button:active{border-color:var(--amber);color:var(--amber)}

.res{margin-top:11px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--s1);
  max-height:260px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.res:empty{display:none}
.fr2{display:flex;justify-content:space-between;align-items:center;gap:11px;width:100%;text-align:left;
  padding:13px 15px;transition:background .15s}
.fr2+.fr2{border-top:1px solid var(--line)}
.fr2.sel{background:var(--amber-soft);box-shadow:inset 3px 0 0 var(--amber)}
.fr2 .a{font-size:14px} .fr2 .b{font-family:var(--mono);font-size:12px;color:var(--dim);margin-top:2px}
.fr2 .k{font-family:var(--mono);font-size:13px;color:var(--amber);font-variant-numeric:tabular-nums;flex:0 0 auto}
.ent{display:flex;justify-content:space-between;align-items:center;gap:11px;padding:13px 15px}
.ent+.ent{border-top:1px solid var(--line)}
.ent .a{font-size:14px} .ent .b{font-family:var(--mono);font-size:12px;color:var(--dim);margin-top:2px}
.ent .rt{display:flex;align-items:center;gap:12px;flex:0 0 auto}
.ent .kc{font-family:var(--mono);font-size:13.5px;font-variant-numeric:tabular-nums}
.del{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--dim);
  border:1px solid var(--line);flex:0 0 auto}
.del:active{color:var(--red);border-color:var(--red)}
.del svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round}
.ent.rm{animation:rmo .26s var(--e) forwards}
@keyframes rmo{to{opacity:0;transform:translateX(-16px);height:0;padding:0}}

.lrow{display:grid;grid-template-columns:1fr 50px 50px 60px 32px;gap:7px;align-items:center;padding:10px 0}
.lrow+.lrow{border-top:1px solid var(--line)}
.lrow input{padding:9px 4px;font-size:15px;text-align:center;border-radius:10px}
.lhead{display:grid;grid-template-columns:1fr 50px 50px 60px 32px;gap:7px;font-family:var(--mono);font-size:10.5px;
  letter-spacing:.09em;text-transform:uppercase;color:var(--dim);padding-bottom:8px;text-align:center}
.lhead span:first-child{text-align:left}

table{width:100%;border-collapse:collapse}
th{text-align:left;font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;
  color:var(--dim);padding:13px 11px 9px;border-bottom:1px solid var(--line)}
td{padding:12px 11px;border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:top;line-height:1.5}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
td.k{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);
  white-space:nowrap;width:44px;padding-top:14px}

/* ── gym: category pills + exercise grid + set form ────── */
.catscroll{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;margin:12px 0 12px;padding-bottom:2px}
.catscroll::-webkit-scrollbar{display:none}
.catpill{flex:0 0 auto;padding:8px 14px;border-radius:99px;background:var(--s0);color:var(--ink-2);
  font-size:12.5px;font-weight:500;white-space:nowrap;border:1px solid transparent;transition:.2s var(--e)}
.catpill.on{background:var(--lift-soft);color:var(--lift);border-color:var(--lift);font-weight:600}
.exgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;
  max-height:300px;overflow-y:auto;padding:3px;margin:0 -3px;scrollbar-width:thin}
.exgrid button{padding:13px 7px;border-radius:13px;border:1px solid var(--line);background:var(--s0);
  color:var(--ink);font-size:12.5px;line-height:1.25;font-weight:500;transition:.2s var(--e)}
.exgrid button.on{background:var(--lift);color:#0B0B0C;border-color:var(--lift);font-weight:600;
  box-shadow:0 5px 16px var(--lift-soft);transform:translateY(-2px)}
.exgrid button.draft{border-color:var(--lift);color:var(--lift);background:var(--lift-soft)}
.setform{margin-top:15px;padding-top:15px;border-top:1px solid var(--line);animation:slidedown .32s var(--e)}
@keyframes slidedown{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}
.setgrid{display:grid;grid-template-columns:.75fr 1.1fr 1fr .85fr;gap:8px;background:var(--s0);
  padding:13px;border-radius:15px;border:1px solid var(--line)}
.setgrid label.f{margin:0}
.setgrid input{background:var(--s1);text-align:center;padding:11px 3px;font-weight:600;border-radius:10px}
.lastline{font-family:var(--mono);font-size:11.5px;color:var(--dim);line-height:1.55;margin:0 0 11px}
.lastline b{color:var(--ink);font-weight:600}
.badge{display:inline-block;padding:4px 8px;border-radius:8px;background:var(--s0);color:var(--ink-2);
  font-family:var(--mono);font-size:11px;font-weight:500;border:1px solid var(--line);
  margin:6px 6px 0 0;vertical-align:top}
.badge.s{background:var(--lift-soft);color:var(--lift);border-color:var(--lift);font-weight:600}

/* ── trend ─────────────────────────────────────────────── */
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);
  border-radius:var(--r);overflow:hidden;margin-top:14px}
.kpi>div{background:var(--s1);padding:16px}
.kpi b{font-family:var(--serif);font-size:28px;font-weight:600;letter-spacing:-.035em;display:block;
  line-height:1.05;font-variant-numeric:tabular-nums}
.kpi b.g{color:var(--green)} .kpi b.r{color:var(--red)} .kpi b.a{color:var(--amber)}
.kpi b.t{color:var(--run)} .kpi b.l{color:var(--lift)}
.kpi span{font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);display:block;margin-top:7px}
.kpi em{font-style:normal;font-size:12.5px;color:var(--ink-2);display:block;margin-top:3px}
.cbox{position:relative;height:190px;margin-top:12px}
.empty{display:grid;place-content:center;text-align:center;gap:6px;height:140px;
  border:1.5px dashed var(--line-hi);border-radius:15px;color:var(--dim);font-size:12.5px;
  padding:18px;margin-top:12px}
.empty b{font-family:var(--serif);font-size:16px;font-weight:500;color:var(--ink-2)}

.meter{height:12px;border-radius:99px;overflow:hidden;display:flex;background:var(--s0);margin-top:14px}
.meter i{display:block;height:100%;transition:width .9s var(--e)}
.meter i.easy{background:var(--run)} .meter i.hard{background:var(--amber)}
.mkey{display:flex;gap:16px;margin-top:11px;font-family:var(--mono);font-size:12px;color:var(--dim);align-items:center;flex-wrap:wrap}
.mkey i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:6px;vertical-align:middle}

/* ── calendar ──────────────────────────────────────────── */
.dow{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:14px 0 6px}
.dow span{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-align:center;color:var(--dim);
  font-weight:600;text-transform:uppercase}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cell{position:relative;aspect-ratio:1;border-radius:9px;background:var(--s0);border:1px solid transparent;
  display:grid;place-items:center;font-family:var(--mono);font-size:10.5px;font-weight:500;
  color:var(--dim);font-variant-numeric:tabular-nums;transition:.18s var(--e);padding:0}
.cell.blank{background:transparent;border:1px dashed var(--line);opacity:.35;pointer-events:none}
.cell.p1{background:rgba(255,138,30,.16);color:var(--ink-2)}
.cell.p2{background:rgba(255,138,30,.34);color:var(--ink-2)}
.cell.p3{background:rgba(255,138,30,.56);color:var(--ink)}
.cell.p4{background:var(--amber);color:#0B0B0C;font-weight:700}
.cell.future{background:transparent;border:1px solid var(--line)}
.cell.today{box-shadow:0 0 0 2px var(--ink) inset;color:var(--ink);font-weight:700}
.cell.race{border-color:var(--run);box-shadow:0 0 0 1px var(--run) inset}
.cell:active{transform:scale(1.12)}
.cell .bars{position:absolute;left:4px;right:4px;bottom:3px;display:flex;gap:3px;height:2.5px}
.cell .bars i{flex:1;border-radius:2px;background:transparent}
.cell .bars i.run{background:var(--run)}
.cell .bars i.lift{background:var(--lift)}
[data-theme="light"] .cell.p4{color:#F7F3EA}
[data-theme="light"] .cell.p3{color:var(--ink)}

/* ── plan ──────────────────────────────────────────────── */
.ph{margin-top:28px}
.phh{display:flex;align-items:baseline;gap:10px;padding-bottom:9px;border-bottom:1.5px solid var(--amber-2)}
.phh h3{color:var(--amber)}
.phh span{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--dim)}
.wk{width:100%;text-align:left;display:flex;gap:13px;align-items:flex-start;padding:14px 4px}
.wk+.wk,.wkd+.wk{border-top:1px solid var(--line)}
.wk .wn{flex:0 0 26px;font-family:var(--serif);font-size:18px;font-weight:600;color:var(--amber);line-height:1.2}
.wk .wb{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.wk .wt{display:block;font-size:14px;line-height:1.4}
.wk .wd{display:block;font-size:12px;color:var(--dim);line-height:1.4}
.wk .wm{flex:0 0 auto;font-family:var(--mono);font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.wk.now{background:var(--amber-soft);box-shadow:inset 3px 0 0 var(--amber);border-radius:0 10px 10px 0}
.wkd{padding:0 0 14px 39px}
.wkd .rr{display:flex;gap:11px;padding:8px 0;font-size:13.5px;border-top:1px solid var(--line)}
.wkd .rr span:first-child{flex:0 0 34px;color:var(--dim);font-family:var(--mono);font-size:11px;letter-spacing:.08em;
  text-transform:uppercase;padding-top:2px}
.wkd em{font-style:normal;color:var(--dim);display:block;font-size:12.5px;margin-top:2px}

.acc+.acc{border-top:1px solid var(--line)}
.acch{display:flex;width:100%;text-align:left;justify-content:space-between;align-items:center;gap:12px;
  padding:16px 17px;font-size:14.5px}
.acch .pm{color:var(--dim);font-size:20px;line-height:1;transition:transform .3s var(--e)}
.acc.open .acch .pm{transform:rotate(45deg);color:var(--amber)}
.accb{display:grid;grid-template-rows:0fr;transition:grid-template-rows .32s var(--e)}
.acc.open .accb{grid-template-rows:1fr}
.accb>div{overflow:hidden}
.accb .in{padding:0 17px 17px;font-size:13.5px;color:var(--ink-2);line-height:1.72}
.accb .in p+p{margin-top:11px}
.accb .in b{color:var(--ink);font-weight:600}
.accb .in .callout b{color:var(--amber)}
.accb .in .callout.rn b{color:var(--run)}
.accb .in .callout.lf b{color:var(--lift)}
.accb .in table{margin-top:6px}

.callout{background:var(--amber-soft);border:1px solid var(--amber-2);border-radius:16px;padding:15px 16px;
  font-size:13.5px;color:var(--ink-2);line-height:1.62;margin-top:14px}
.callout b{color:var(--amber);font-weight:600}
.callout.rn{background:var(--run-soft);border-color:var(--run)}
.callout.rn b{color:var(--run)}
.callout.lf{background:var(--lift-soft);border-color:var(--lift)}
.callout.lf b{color:var(--lift)}
.banner{border:1px solid var(--red);background:rgba(210,96,63,.08);border-radius:16px;padding:14px 16px;
  font-size:13px;line-height:1.6;color:var(--ink-2);margin-top:14px}
.banner b{color:var(--red);font-weight:600}
.banner.soft{border-color:var(--line-hi);background:var(--s1);color:var(--ink-2)}
.banner.soft b{color:var(--amber)}

/* ── floating nav ──────────────────────────────────────── */
nav{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 12px);z-index:50;
  display:flex;justify-content:center;pointer-events:none;padding:0 var(--gut)}
nav .navbar{pointer-events:auto;position:relative;display:flex;padding:6px;border-radius:22px;
  background:var(--nav-bg);border:1px solid var(--line-hi);
  box-shadow:0 12px 38px rgba(0,0,0,.55),0 1px 0 rgba(255,255,255,.05) inset;
  width:100%;max-width:424px}
[data-theme="light"] nav .navbar{box-shadow:0 10px 30px rgba(40,34,18,.16)}
@supports (backdrop-filter:blur(1px)){
  nav .navbar{backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6)}
}
nav .glide{position:absolute;top:6px;bottom:6px;border-radius:17px;background:var(--amber-soft);
  border:1px solid var(--amber-2);transition:transform .38s var(--e);z-index:0;left:6px;
  width:calc((100% - 12px)/4)}
nav button{flex:1;padding:9px 0 8px;min-height:52px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:5px;
  font-family:var(--mono);font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--dim);
  transition:color .28s var(--e);position:relative;z-index:1;font-weight:500}
nav button[aria-selected="true"]{color:var(--amber)}
nav svg{width:21px;height:21px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}

/* ── sheet ─────────────────────────────────────────────── */
.scrim{position:fixed;inset:0;background:rgba(4,5,8,.66);z-index:60;opacity:0;pointer-events:none;
  transition:opacity .3s var(--e);backdrop-filter:blur(4px)}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--bg);
  border-top:1px solid var(--line-hi);border-radius:26px 26px 0 0;max-height:92dvh;overflow-y:auto;
  -webkit-overflow-scrolling:touch;transform:translateY(101%);transition:transform .38s var(--e);
  max-width:460px;margin:0 auto;padding:0 var(--gut) calc(env(safe-area-inset-bottom) + 30px)}
.sheet.on{transform:none}
.grab{width:38px;height:5px;border-radius:99px;background:var(--line-hi);margin:11px auto 2px}
.shd{display:flex;align-items:center;justify-content:space-between;padding:10px 0 6px;
  position:sticky;top:0;background:var(--bg);z-index:2}

#toast{position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom));
  transform:translate(-50%,14px);z-index:70;background:var(--s2);border:1px solid var(--line-hi);
  border-radius:99px;padding:11px 19px;font-size:13px;opacity:0;pointer-events:none;
  transition:opacity .25s var(--e),transform .32s var(--e);box-shadow:0 10px 30px rgba(0,0,0,.5);
  white-space:nowrap;max-width:88vw;overflow:hidden;text-overflow:ellipsis}
#toast.on{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
@media (max-width:359px){
  :root{--gut:14px}
  .lrow,.lhead{grid-template-columns:1fr 44px 44px 52px 28px}
  .ring{flex:0 0 96px;width:96px;height:96px}
  .ring svg{width:96px;height:96px}
  .setgrid{grid-template-columns:1fr 1fr;gap:8px}
}
</style>
</head>

};

/* One-time migration from the older block76:* tracker. */
function importLegacy(){
  let days = 0, foods = 0, sets = 0;
  try{
    const old = k=>{ try{ const r = localStorage.getItem(k); return r ? JSON.parse(r) : null; }catch(e){ return null; } };
    if(localStorage.getItem("block:migrated-76")) return null;
    const L = old("block76:log"), F = old("block76:food"),
          C = old("block76:customfoods"), W = old("block76:workout"), P = old("block76:prefs");
    if(!L && !F && !C && !W) return null;
    if(L) Object.keys(L).forEach(d=>{
      const e = L[d]; if(!e) return;
      const t = LOGS[d] || blank();
      if(t.weight_kg == null && e.w != null) t.weight_kg = e.w;
      if(!t.run && e.km) t.run = {distance_km:e.km, duration_min:e.min||null,
        avg_pace:(e.km&&e.min)?r1(e.min/e.km):null, avg_hr:null, feel:"", notes:e.note||""};
      if(e.run) t.runDone = true;
      if(e.lift) t.liftDone = true;
      if(e.sleep) t.hours.sleep = Math.max(t.hours.sleep||0, 7);
      if(e.rpe) t.feel = e.rpe;
      if(e.note && !t.note) t.note = e.note;
      LOGS[d] = t; days++;
    });
    if(F) Object.keys(F).forEach(d=>{
      const list = F[d]; if(!Array.isArray(list) || !list.length) return;
      const t = LOGS[d] || blank();
      if(t.food && t.food.length) return;
      t.food = list.map(e=>{ const k = e.grams/100, p = e.per100 || {};
        return {food:e.name, grams:e.grams, kcal:(p.kcal||0)*k, protein:(p.p||0)*k,
                carbs:(p.c||0)*k, fat:(p.f||0)*k, time:""}; });
      LOGS[d] = t; foods++;
    });
    if(Array.isArray(C)) C.forEach(f=>{
      if(CUSTOM_FOODS.some(x=>x.n === f.name)) return;
      CUSTOM_FOODS.push({id:f.id||("c"+Date.now()+Math.random()), n:f.name,
        kcal:f.kcal, p:f.p, c:f.c, f:f.f});
    });
    if(W) Object.keys(W).forEach(d=>{
      const wd = W[d], list = Array.isArray(wd) ? wd : (wd ? wd.logs : null);
      if(!list || !list.length) return;
      if(GYM[d]) return;
      GYM[d] = {preset:(wd && wd.preset) || "", sets:list.map(s=>({
        id:s.id || ("g"+Date.now()+Math.random()), name:s.name, s:s.s ?? null,
        w:s.w ?? null, r:s.r || "", rpe:s.rpe ?? null}))};
      sets += list.length;
    });
    if(P && P.presets && Object.keys(P.presets).length)
      SETTINGS.presets = Object.assign({}, SETTINGS.presets, P.presets);
    if(P && P.startW) SETTINGS.startWeight = P.startW;
    localStorage.setItem("block:migrated-76","1");
    storage.set(K.logs, LOGS); saveFoods(); saveGym(); saveSettings();
    return {days, foods, sets};
  }catch(e){ return null; }
}

const pad2 = n => String(n).padStart(2,"0");
const iso = d => d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());
const parseISO = s => new Date(s+"T00:00:00");
const todayISO = () => iso(new Date());
function addDays(s,n){ const d = parseISO(s); d.setDate(d.getDate()+n); return iso(d); }
function daysBetween(a,b){ return Math.round((parseISO(b)-parseISO(a))/86400000); }
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DOW = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
function pretty(s){ const d = parseISO(s); return DOW[d.getDay()]+", "+d.getDate()+" "+MON[d.getMonth()]; }
function shortDate(s){ const d = parseISO(s); return d.getDate()+" "+MON[d.getMonth()]; }
const r0 = n => Math.round(n);
const r1 = n => Math.round(n*10)/10;

const WEEK_BY_DATE = {};
PLAN.weeks.forEach(w=>{
  w.s.forEach(s=>{ SESSION_BY_DATE[s.date] = s; });
  for(let i=0;i<7;i++) WEEK_BY_DATE[addDays(w.start,i)] = w;
});
const weekFor = d => WEEK_BY_DATE[d] || null;
function phaseLabel(date){
  const w = weekFor(date);
  if(w) return {w:"Wk "+w.w, phase:w.phase};
  if(inPreBlock(date)) return {w:"Base", phase:"Pre-block"};
  return null;
}

/* If the challenge is ever set to start before the block, this covers the gap. */
const PRE_WEEK = {
 0:{km:5, t:"5 km easy",              k:"easy", d:"Effort, not pace. Expect a high heart rate."},
 1:{km:0, t:"Rest",                   k:"rest", d:""},
 2:{km:4, t:"4 km easy",              k:"easy", d:"Conversational the whole way."},
 3:{km:0, t:"Rest",                   k:"rest", d:""},
 4:{km:4, t:"4 km easy + 4 strides",  k:"easy", d:"Strides: 20 s fast and relaxed, 60 s walk."},
 5:{km:0, t:"Rest",                   k:"rest", d:""},
 6:{km:5, t:"5 km easy",              k:"easy", d:"Same route each week — it becomes your benchmark."}
};
function inPreBlock(date){
  return date >= SETTINGS.hardStart && date < SETTINGS.blockStart;
}
function plannedRun(date){
  const s = SESSION_BY_DATE[date];
  if(s) return {type:s.k, distance_km:s.km, title:s.t, detail:s.d, pace:paceBand(s.k)};
  if(inPreBlock(date)){
    const p = PRE_WEEK[parseISO(date).getDay()];
    return {type:p.k, distance_km:p.km, title:p.t, detail:p.d, pace:paceBand(p.k), pre:true};
  }
  return {type:"rest", distance_km:0, title:"Rest", detail:"No run scheduled.", pace:null};
}
function plannedStrength(date){
  const w = weekFor(date);
  const wd = parseISO(date).getDay();
  if(!w){
    if(!inPreBlock(date)) return null;
    const k = LIFT_DAYS[wd];
    return k ? Object.assign({}, LIFTS[k], {phase:LIFT_PHASE["Foundation"]}) : null;
  }
  const ph = LIFT_PHASE[w.phase] || {tag:"Build", note:""};
  if(w.phase === "Taper"){
    if(wd !== 1) return null;
    return Object.assign({}, LIFTS.UA, {phase:ph, light:true});
  }
  if(w.phase === "Race specific" && wd === 6) return null;
  const k = LIFT_DAYS[wd];
  return k ? Object.assign({}, LIFTS[k], {phase:ph}) : null;
}
function liftExercises(l){
  if(!l) return [];
  const out = [];
  l.groups.forEach(g=>g.ex.forEach(e=>out.push(Object.assign({group:g.g}, e))));
  return out;
}
function paceBand(kind){
  const map = {easy:"Easy", long:"Long run", steady:"Steady", quality:"Threshold",
               test:"Threshold", race:"Threshold"};
  const row = PLAN.zones.find(z=>z[0] === map[kind]);
  return row ? row[3] : null;
}

/* ── heat ────────────────────────────────────────────────────── */
let WEATHER = null;
function dewBand(dew){
  return DEW_BANDS.find(b=>dew <= b.max) || DEW_BANDS[DEW_BANDS.length-1];
}
function currentDew(){
  if(SETTINGS.autoWeather && WEATHER && typeof WEATHER.dew === "number") return WEATHER.dew;
  return SETTINGS.manualDew;
}
function parsePace(str){
  if(!str) return null;
  const parts = String(str).split(/[–\-]/).map(x=>x.trim()).filter(Boolean);
  const secs = parts.map(p=>{ const m = p.split(":"); return (+m[0])*60 + (+(m[1]||0)); });
  return secs.length === 2 ? secs : (secs.length === 1 ? [secs[0], secs[0]] : null);
}
function paceStr(v){ const m = Math.floor(v), s = Math.round((v-m)*60);
  return s === 60 ? (m+1)+":00" : m+":"+pad2(s); }
function fmtBand(secs){ return paceStr(secs[0]/60)+"–"+paceStr(secs[1]/60); }
function adjustedPace(kind){
  const raw = parsePace(paceBand(kind));
  if(!raw) return null;
  const dew = currentDew(), band = dewBand(dew);
  return {raw, dew, band, adj:[raw[0]+band.pen, raw[1]+band.pen]};
}
const isTaper = date => {
  const dl = daysBetween(date, SETTINGS.raceDate);
  return dl >= 0 && dl <= 21;
};

/* ═══════════════════════════════════════════════════════════════
   CALORIE TARGET
   ═══════════════════════════════════════════════════════════════ */
function currentWeight(date){
  const avg = rollingWeight(date, 7);
  if(avg != null) return avg;
  const last = lastWeightOnOrBefore(date);
  return last != null ? last : SETTINGS.startWeight;
}
function calorieTarget(date){
  const w = currentWeight(date);
  const tdee = w * SETTINGS.tdeeFactor;
  const run = plannedRun(date);
  let mult = 1, why = "Full deficit day.";
  if(isTaper(date)){ mult = 0; why = "Taper. Eating at maintenance until race day."; }
  else if(run.type === "race"){ mult = 0; why = "Race day. Fuel, don't restrict."; }
  else if(run.type === "long" && run.distance_km >= 15){ mult = 0; why = "Long run of 15 km or more. Maintenance, not a deficit."; }
  else if(run.type === "long"){ mult = 0.5; why = "Long run day. Half the usual deficit."; }
  else if(run.type === "quality" || run.type === "test"){ mult = 0.6; why = "Quality session. Deficit trimmed back."; }
  else if(run.type === "steady"){ mult = 0.8; why = "Steady work today. Slightly softer deficit."; }
  else if(run.type === "rest" && !plannedStrength(date)){ mult = 1.15; why = "Full rest. The cheapest day of the week to bank a deficit."; }
  const kcal = Math.round((tdee - SETTINGS.deficit*mult)/10)*10;
  const p = Math.round(w*SETTINGS.proteinPerKg);
  const f = Math.round(w*SETTINGS.fatPerKg);
  const c = Math.max(0, Math.round((kcal - p*4 - f*9)/4));
  return {kcal, protein:p, fat:f, carbs:c, why, maintenance:Math.round(tdee/10)*10};
}

/* ═══════════════════════════════════════════════════════════════
   THE DAY OBJECT
   ═══════════════════════════════════════════════════════════════ */
const isWeekend = date => { const w = parseISO(date).getDay(); return w === 0 || w === 6; };
const cfaTargetFor = date => isWeekend(date) ? SETTINGS.cfaWeekend : SETTINGS.cfaWeekday;

function blank(){
  return {weight_kg:null, food:[], run:null, lift:null, feel:0, note:"",
          hours:{growth:0, cfa:0, sleep:0}, runDone:false, liftDone:false};
}
function raw(date){
  if(!LOGS[date]) LOGS[date] = blank();
  const l = LOGS[date];
  if(!l.food) l.food = [];
  if(!l.hours) l.hours = {growth:0, cfa:0, sleep:0};
  return l;
}
function gymFor(date){
  if(!GYM[date]) GYM[date] = {preset:"", sets:[]};
  if(!GYM[date].sets) GYM[date].sets = [];
  return GYM[date];
}
function buildDay(date){
  const l = LOGS[date] || blank();
  const food = l.food || [];
  const t = calorieTarget(date);
  const sum = food.reduce((a,e)=>({
    kcal:a.kcal+e.kcal, p:a.p+e.protein, c:a.c+e.carbs, f:a.f+e.fat
  }), {kcal:0,p:0,c:0,f:0});

  const pRun = plannedRun(date);
  const pLift = plannedStrength(date);
  const runDone = !!l.runDone || pRun.type === "rest";
  const liftDone = !!l.liftDone || !pLift;
  const prescribed = pRun.type !== "rest" || !!pLift;
  const gsets = (GYM[date] && GYM[date].sets) ? GYM[date].sets.length : 0;

  const hrs = l.hours || {growth:0,cfa:0,sleep:0};
  const dayNo = daysBetween(SETTINGS.hardStart, date) + 1;
  const inHard = dayNo >= 1 && dayNo <= SETTINGS.hardLength;
  const workoutMet = prescribed ? (runDone && liftDone)
    : !!(l.runDone || l.liftDone || l.run || l.lift || gsets);
  const pillars = [
    {k:"growth",name:"Personal growth",  val:hrs.growth||0, target:SETTINGS.growthTarget, unit:"h"},
    {k:"train", name:"Workout and run",  val:workoutMet?1:0, target:1,                    unit:"done"},
    {k:"cfa",   name:"CFA Level II",     val:hrs.cfa||0,    target:cfaTargetFor(date),    unit:"h"},
    {k:"sleep", name:"Sleep",            val:hrs.sleep||0,  target:SETTINGS.sleepTarget,  unit:"h"}
  ];
  pillars.forEach(p=>p.met = p.val >= p.target);

  return {
    date,
    weight_kg: l.weight_kg,
    feel: l.feel || 0,
    note: l.note || "",
    calories: {target:t.kcal, consumed:Math.round(sum.kcal),
      protein_g:Math.round(sum.p), carbs_g:Math.round(sum.c), fat_g:Math.round(sum.f),
      targets:t, entries:food},
    running: {planned:pRun, actual:l.run || null, completed:runDone},
    strength:{planned:pLift, actual:l.lift || null, completed:liftDone, gymSets:gsets},
    hard75:  {day_number:dayNo, in_challenge:inHard, pillars,
      growth_hours:hrs.growth||0, cfa_hours:hrs.cfa||0, sleep_hours:hrs.sleep||0,
      workout_run_completed:workoutMet,
      all_pillars_met:pillars.every(p=>p.met)},
    week: weekFor(date),
    touched: !!(l.weight_kg || food.length || l.run || l.lift || gsets || l.feel ||
               (hrs.growth||hrs.cfa||hrs.sleep) || l.runDone || l.liftDone)
  };
}

/* ---- history helpers ---------------------------------------- */
function lastWeightOnOrBefore(date){
  for(let i=0;i<180;i++){
    const d = addDays(date,-i), l = LOGS[d];
    if(l && l.weight_kg != null) return l.weight_kg;
  }
  return null;
}
function rollingWeight(date, n){
  const vals = [];
  for(let i=0;i<n;i++){
    const l = LOGS[addDays(date,-i)];
    if(l && l.weight_kg != null) vals.push(l.weight_kg);
  }
  if(vals.length < 3) return null;
  return r1(vals.reduce((a,b)=>a+b,0)/vals.length);
}
function weekStart(date){
  const d = parseISO(date);
  d.setDate(d.getDate() - ((d.getDay()+6)%7));
  return iso(d);
}
function weekBalance(mondayISO){
  let bal = 0, days = 0, km = 0;
  for(let i=0;i<7;i++){
    const dt = addDays(mondayISO,i);
    if(dt > todayISO()) break;
    const l = LOGS[dt];
    if(!l || !l.food || !l.food.length) continue;
    const day = buildDay(dt);
    bal += day.calories.consumed - day.calories.target;
    days++;
    if(l.run && l.run.distance_km) km += l.run.distance_km;
  }
  return {balance:Math.round(bal), days, km:r1(km)};
}
function weightPace(date){
  const now = rollingWeight(date,7) || lastWeightOnOrBefore(date);
  if(now == null) return null;
  const left = daysBetween(date, SETTINGS.targetWeightDate);
  const toGo = r1(now - SETTINGS.targetWeight);
  const total = daysBetween(SETTINGS.blockStart, SETTINGS.targetWeightDate);
  const gone = daysBetween(SETTINGS.blockStart, date);
  const shouldBe = r1(SETTINGS.startWeight -
    (SETTINGS.startWeight - SETTINGS.targetWeight) * Math.min(1, Math.max(0, gone/total)));
  const rateNeeded = left > 0 ? r1(toGo / (left/7)) : null;
  return {now, toGo, daysLeft:left, shouldBe, rateNeeded, ahead:r1(shouldBe - now)};
}
function polarSplit(fromISO, toISO){
  let easy = 0, hard = 0;
  for(let dt = fromISO; dt <= toISO; dt = addDays(dt,1)){
    const l = LOGS[dt];
    if(!l || !l.run || !l.run.distance_km) continue;
    const km = l.run.distance_km;
    const w = HARD_KINDS[plannedRun(dt).type] || 0;
    hard += km*w; easy += km*(1-w);
  }
  const tot = easy+hard;
  return tot ? {easy:r1(easy), hard:r1(hard), pct:Math.round(easy/tot*100), km:r1(tot)} : null;
}
/* Tonnage: prescribed-session weights plus everything logged on the gym floor. */
function tonnage(fromISO, toISO){
  let t = 0;
  for(let dt = fromISO; dt <= toISO; dt = addDays(dt,1)){
    const l = LOGS[dt];
    if(l && l.lift && l.lift.exercises) l.lift.exercises.forEach(e=>{
      const reps = parseInt(String(e.reps||"").replace(/[^0-9].*$/,""),10) || 0;
      if(e.weight_kg && reps && e.sets) t += e.weight_kg*reps*e.sets;
    });
    const g = GYM[dt];
    if(g && g.sets) g.sets.forEach(s=>{
      const reps = parseInt(String(s.r||"").replace(/[^0-9].*$/,""),10) || 0;
      if(s.w && reps) t += s.w*reps;
    });
  }
  return t;
}
function lastTimeFor(name, beforeISO){
  const keys = Object.keys(GYM).filter(k=>k < beforeISO).sort().reverse();
  for(const k of keys){
    const hits = (GYM[k].sets||[]).filter(s=>s.name === name);
    if(hits.length) return {date:k, sets:hits};
  }
  return null;
}


/* ═══════════════════════════════════════════════════════════════
   DIRECTIVE ENGINE
   Pure functions over (day, history, settings). Each rule returns
   null or {id, tone, tag, text}. Add a rule and nothing else changes.
   tone: "calm" | "" (amber) | "warn" | "good"
   ═══════════════════════════════════════════════════════════════ */
const RULES = [

  function taper(d){
    if(!isTaper(d.date)) return null;
    const dl = daysBetween(d.date, SETTINGS.raceDate);
    if(dl < 0) return null;
    return {id:"taper", tone:"", tag:"Taper — "+dl+" days out",
      text:"Fat loss is off the table until the 14th. Eat at maintenance or a little above, put carbs in, "+
        "and treat sleep as the session that matters most. Volume drops; sharpness doesn't."};
  },

  function beforeStart(d){
    const toGo = daysBetween(d.date, SETTINGS.blockStart);
    if(toGo <= 0 || toGo > 21) return null;
    return {id:"pre-start", tone:"", tag:toGo === 1 ? "Tomorrow" : toGo+" days out",
      text:"The block and 75 Hard both open on "+shortDate(SETTINGS.blockStart)+". Between now and "+
        "then: weigh yourself every morning so the average has something to work with, get the shoes "+
        "bought, and read Straight talk on the Plan screen once."};
  },

  function raceDay(d){
    if(d.running.planned.type !== "race") return null;
    return {id:"race", tone:"good", tag:"Race day",
      text:"21.1 km. Start slower than feels right and hold it to 15 km. Then decide what's left."};
  },

  function longRunToday(d){
    const r = d.running.planned;
    if(r.type !== "long") return null;
    const carbs = d.calories.targets.carbs;
    const fuel = r.distance_km >= 12
      ? " Past 75 minutes you need 30–60 g of carbs an hour — use the exact product you'll race with."
      : " Under 75 minutes, water is enough.";
    return {id:"long-today", tone:"", tag:"Long run",
      text:r.title+" at "+paceTextFor("long")+". "+d.calories.target+" kcal and "+carbs+
        " g of carbs today — maintenance, not a deficit, whatever the week's balance says."+fuel};
  },

  function heat(d){
    const a = adjustedPace(d.running.planned.type);
    if(!a || d.running.planned.type === "rest") return null;
    if(a.band.pen < 12) return null;
    return {id:"heat", tone:a.band.pen >= 50 ? "warn" : "calm", tag:"Dew "+r1(a.dew)+"°",
      text:a.band.label+" conditions. "+a.band.advice+" Prescribed band is "+fmtBand(a.raw)+
        ", which today is really "+fmtBand(a.adj)+". Run the effort, not the number."};
  },

  function acclimatise(d){
    const gone = daysBetween(SETTINGS.blockStart, d.date);
    if(gone < 0 || gone > 13) return null;
    const stage = gone < 4
      ? "Easy 30–45 minutes only. Your heart rate will read high and your pace will read slow. Both are expected — do not chase either."
      : gone < 10
      ? "Extend to 45–60 minutes, still easy to moderate. No quality work inside the heat yet."
      : "You can start putting quality back inside the heat. Most of the adaptation is done by day 14.";
    return {id:"acclim", tone:"calm", tag:"Day "+(gone+1)+" of heat", text:stage};
  },

  function polarised(d){
    const from = addDays(d.date,-27);
    const sp = polarSplit(from, d.date);
    if(!sp || sp.km < 40) return null;
    if(sp.pct >= 76 && sp.pct <= 88) return null;
    return sp.pct < 76
      ? {id:"polar", tone:"warn", tag:"Too much grey",
         text:"Only "+sp.pct+"% of the last four weeks was easy, against a target of 80%. The easy runs are the ones being run too hard — that is what caps the hard sessions."}
      : {id:"polar", tone:"calm", tag:"All easy",
         text:sp.pct+"% of the last four weeks was easy. Comfortable, but the 20% that is meant to be genuinely hard isn't happening. Threshold work is the highest-return thing in the block."};
  },

  function longRunTomorrow(d){
    const t = plannedRun(addDays(d.date,1));
    if(!(t.type === "long" && t.distance_km >= 15)) return null;
    if(d.running.planned.type === "long") return null;
    return {id:"carb-load", tone:"", tag:"Carb load",
      text:t.distance_km+" km tomorrow. Eat at or slightly above maintenance today ("+
        d.calories.targets.maintenance+" kcal) and load the carbs into dinner. A deficit tonight "+
        "gets paid for at kilometre 14."};
  },

  function restDayDeficit(d){
    if(d.running.planned.type !== "rest" || d.strength.planned) return null;
    const wk = weekBalance(weekStart(d.date));
    if(wk.balance < -400) return null;
    return {id:"rest-bank", tone:"calm", tag:"Rest day",
      text:"Nothing scheduled and nothing to fuel. The week is running at "+
        (wk.balance >= 0 ? "+" : "")+wk.balance+" kcal so far — this is the cheapest day on the "+
        "calendar to bank a deficit."};
  },

  function surplusStreak(d){
    if(isTaper(d.date)) return null;
    const w0 = weekStart(d.date);
    const a = weekBalance(addDays(w0,-7)), b = weekBalance(addDays(w0,-14));
    if(a.days < 4 || b.days < 4) return null;
    if(a.balance <= 0 || b.balance <= 0) return null;
    return {id:"surplus-2w", tone:"warn", tag:"Two weeks in surplus",
      text:"The last two full weeks came in at +"+a.balance+" and +"+b.balance+
        " kcal against target. The target is fat loss. That gap is the whole reason the scale "+
        "isn't moving — it isn't the training."};
  },

  function flatWeight(d){
    if(isTaper(d.date)) return null;
    const now = rollingWeight(d.date,7), then = rollingWeight(addDays(d.date,-10),7);
    if(now == null || then == null) return null;
    if(now < then - 0.15) return null;
    return {id:"weight-flat", tone:"warn", tag:"Trend has stalled",
      text:"The 7-day average is "+now+" kg against "+then+" kg ten days ago. Drop 150 kcal and hold "+
        "it for a full week before changing anything else — and look at the logging before the "+
        "targets. Most stalls are unlogged food, not a broken metabolism."};
  },

  function behindPace(d){
    if(isTaper(d.date)) return null;
    const p = weightPace(d.date);
    if(!p || p.daysLeft <= 0) return null;
    if(p.ahead >= -0.4) return null;
    return {id:"behind-pace", tone:"warn", tag:"Behind the line",
      text:p.now+" kg against a straight-line path of "+p.shouldBe+" kg for today. "+p.daysLeft+
        " days to "+shortDate(SETTINGS.targetWeightDate)+" and "+p.toGo+" kg to go — that is "+
        p.rateNeeded+" kg a week from here. Check adherence and step count for a week before you "+
        "touch calories."};
  },

  function aheadOfLine(d){
    if(isTaper(d.date)) return null;
    const p = weightPace(d.date);
    if(!p || p.ahead < 1.5) return null;
    return {id:"ahead", tone:"good", tag:"Ahead of the line",
      text:"The average is "+p.ahead+" kg under target for today. If long runs are getting harder or "+
        "the lifts are dropping, add 150 kcal. Faster is not better here."};
  },

  /* ── the four rules carried over from the 76-day tracker ─────────── */

  function twoHardSundays(d){
    if(d.date !== todayISO()) return null;
    const hard = [];
    for(let i=1;i<=15 && hard.length<2;i++){
      const dt = addDays(d.date,-i);
      if(parseISO(dt).getDay() !== 0) continue;
      const l = LOGS[dt];
      if(l && l.feel) hard.push(l.feel);
    }
    if(hard.length < 2 || hard[0] < 4 || hard[1] < 4) return null;
    return {id:"hard-sundays", tone:"warn", tag:"Two hard Sundays",
      text:"Both of the last two long runs came back sore or worse. Cut Saturday's lower work in "+
        "half until a long run feels normal again. Keep the shoulder volume — that isn't the problem."};
  },

  function threeFlatDays(d){
    if(d.date !== todayISO()) return null;
    let streak = 0;
    for(let i=1;i<=4;i++){
      const l = LOGS[addDays(d.date,-i)];
      if(l && l.feel >= 3) streak++; else break;
    }
    if(streak < 3) return null;
    return {id:"flat-3", tone:"warn", tag:"Three flat days",
      text:"Three days in a row logged flat or worse. Take the next easy day genuinely easy, or take "+
        "it off entirely. Nothing in this block is worth six weeks out of it."};
  },

  function sleepLeak(d){
    if(d.date !== todayISO()) return null;
    let short = 0, have = 0;
    for(let i=1;i<=7;i++){
      const l = LOGS[addDays(d.date,-i)];
      if(!l || !buildDay(addDays(d.date,-i)).touched) continue;
      have++;
      if((l.hours && l.hours.sleep || 0) < SETTINGS.sleepTarget) short++;
    }
    if(have < 5 || short < 4) return null;
    return {id:"sleep-leak", tone:"warn", tag:"Sleep is the leak",
      text:"Under "+SETTINGS.sleepTarget+" hours on "+short+" of the last "+have+" logged days. In a "+
        "deficit that shifts the loss from fat towards muscle and blunts every session you do."};
  },

  function missedLongRun(d){
    if(d.date !== todayISO()) return null;
    for(let i=1;i<=7;i++){
      const dt = addDays(d.date,-i);
      const p = plannedRun(dt);
      if(p.type !== "long") continue;
      const l = LOGS[dt];
      if(l && (l.runDone || (l.run && l.run.distance_km))) return null;
      if(!l) return null;
      return {id:"missed-long", tone:"warn", tag:"Long run missed",
        text:shortDate(dt)+"'s "+p.title.toLowerCase()+" never got logged. This is the one session "+
          "worth rescheduling rather than writing off — move it onto a rest day this week and shift "+
          "that day's lift."};
    }
    return null;
  },

  function pillarRisk(d){
    if(!d.hard75.in_challenge) return null;
    if(d.date !== todayISO()) return null;
    if(new Date().getHours() < SETTINGS.eveningHour) return null;
    const open = d.hard75.pillars.filter(p=>p.val === 0);
    if(!open.length) return null;
    const rank = missRanking();
    open.sort((a,b)=>(rank[b.k]||0)-(rank[a.k]||0));
    const SHORT = {growth:"personal growth", train:"training", cfa:"CFA study", sleep:"sleep"};
    const lead = open[0];
    return {id:"pillar-risk", tone:"warn", tag:"Day "+d.hard75.day_number,
      text:"Nothing logged against "+listify(open.map(p=>SHORT[p.k]))+". "+
        (rank[lead.k] ? SHORT[lead.k][0].toUpperCase()+SHORT[lead.k].slice(1)+
          " is the one you miss most — start there." : "Start with whichever is shortest.")};
  },

  function missedYesterday(d){
    if(d.date !== todayISO()) return null;
    const y = addDays(d.date,-1), ly = LOGS[y];
    if(!ly) return null;
    if(ly.missAck) return null;
    const yd = buildDay(y);
    const missRun = yd.running.planned.type !== "rest" && !yd.running.completed;
    const missLift = !!yd.strength.planned && !yd.strength.completed;
    if(!missRun && !missLift) return null;
    if(!yd.touched) return null;
    const what = missRun && missLift ? "yesterday's run and lift"
      : missRun ? "yesterday's "+yd.running.planned.title.toLowerCase()
      : "yesterday's "+yd.strength.planned.name.toLowerCase();
    return {id:"missed", tone:"calm", tag:"Yesterday", ack:y,
      text:what.charAt(0).toUpperCase()+what.slice(1)+" went unlogged. Don't stack it onto today — "+
        "a missed session inside a 23-week block costs nothing."};
  },

  function proteinShort(d){
    if(d.calories.consumed < d.calories.target*0.6) return null;
    const t = d.calories.targets.protein, got = d.calories.protein_g;
    if(got >= t*0.8) return null;
    return {id:"protein", tone:"calm", tag:"Protein",
      text:got+" g logged against "+t+" g. In a deficit and training six days a week, protein is what "+
        "decides whether the weight you lose comes off the right place."};
  },

  function plainDay(d){
    const r = d.running.planned, s = d.strength.planned;
    const bits = [];
    if(r.type !== "rest") bits.push(r.title+" at "+paceTextFor(r.type));
    if(s) bits.push(s.name.replace(" · "," ")+(s.light ? ", light" : ""));
    const body = bits.length ? bits.join(", then ")+". " : "Nothing on the plan. ";
    return {id:"plain", tone:"calm", tag:bits.length ? "On the plan" : "Clear day",
      text:body+d.calories.target+" kcal and "+d.calories.targets.protein+
        " g protein. "+d.calories.targets.why};
  }
];

function paceTextFor(kind){
  const a = adjustedPace(kind);
  if(!a) return "your own effort";
  return fmtBand(a.adj)+" /km";
}
function listify(a){
  if(a.length === 1) return a[0];
  if(a.length === 2) return a[0]+" and "+a[1];
  return a.slice(0,-1).join(", ")+" and "+a[a.length-1];
}
function missRanking(){
  const count = {growth:0, train:0, cfa:0, sleep:0};
  let n = 0;
  const start = SETTINGS.hardStart, end = todayISO();
  for(let dt = start; dt < end && n < 120; dt = addDays(dt,1)){
    const l = LOGS[dt];
    if(!l) continue;
    const day = buildDay(dt);
    if(!day.touched) continue;
    n++;
    day.hard75.pillars.forEach(p=>{ if(!p.met) count[p.k]++; });
  }
  return n >= 5 ? count : {};
}

const LEAD_IDS = ["race","taper","pre-start","long-today","carb-load","rest-bank","plain"];
function evaluateDirectives(day){
  const out = [];
  for(const rule of RULES){
    let r = null;
    try{ r = rule(day); }catch(e){ r = null; }
    if(r) out.push(r);
  }
  const lead = out.find(x=>LEAD_IDS.includes(x.id)) || out[0];
  const notes = out.filter(x=>x !== lead && x.id !== "plain").slice(0,3);
  return lead ? [lead].concat(notes) : notes;
}

function countTo(el, to){
  if(!el) return;
  const t0 = performance.now(), dur = 560;
  (function step(now){
    const k = Math.min(1,(now-t0)/dur), e = 1-Math.pow(1-k,3);
    el.textContent = Math.round(to*e);
    if(k < 1) requestAnimationFrame(step);
  })(performance.now());
}

/* ── strength: the prescribed session, then the gym floor ──────── */
function logLift(){
  const d = buildDay(cursor), p = d.strength.planned;
  const saved = (d.strength.actual && d.strength.actual.exercises) || [];
  const pres = liftExercises(p);
  const extra = saved.filter(x=>!pres.some(e=>e.n === x.name));
  const row = (name, sub, sets, reps, wt, on)=>
    '<div class="lrow" data-ex="'+esc(name)+'">'+
    '<div><div class="xn" style="font-size:12px">'+esc(name)+'</div>'+
      '<div class="xd">'+esc(sub)+'</div></div>'+
    '<input type="number" inputmode="numeric" class="i-s" placeholder="'+esc(sets)+'" value="'+(wt.sets??"")+'">'+
    '<input type="text" inputmode="numeric" class="i-r" placeholder="reps" value="'+esc(wt.reps??"")+'">'+
    '<input type="number" inputmode="decimal" class="i-w" placeholder="kg" value="'+(wt.weight_kg??"")+'">'+
    '<button class="mini'+(on?" on":"")+'" data-tick>'+CHECK+'</button></div>';

  let h = "";
  if(p || extra.length){
    h += (p ? '<div class="callout lf"><b>'+esc(p.name)+'</b> · '+esc(p.dur)+'<br>'+esc(p.focus)+'</div>' : "")+
      '<div class="card pad">'+
      '<div class="lhead"><span>Prescribed</span><span>sets</span><span>reps</span><span>kg</span><span></span></div>'+
      pres.map(e=>{ const s = saved.find(x=>x.name === e.n) || {};
        return row(e.n, e.group+" · "+e.s+" × "+e.r, e.s, e.r, s, !!s.completed); }).join("")+
      extra.map(x=>row(x.name, "added", "", "", x, !!x.completed)).join("")+
      '<button class="btn lift" id="lsave">Save session</button>'+
      '<button class="btn g" id="ldone">'+((LOGS[cursor]||{}).liftDone ? "Mark not done" : "Mark session complete")+'</button>'+
      '</div>';
  } else {
    h += '<div class="callout">No lift scheduled. The block puts strength on Monday, Wednesday, '+
      'Friday and Saturday — anything you do today still logs below.</div>';
  }
  h += sh("Add a prescribed-lift line")+'<div class="card pad">'+
    '<label class="f" style="margin-top:0"><span>Exercise</span>'+
    '<input type="text" id="exq" list="exl" placeholder="type or pick"></label>'+
    '<datalist id="exl">'+EX_LIST.map(e=>'<option value="'+esc(e)+'">').join("")+'</datalist>'+
    '<button class="btn g" id="exadd">Add to this day</button></div>';
  h += gymBlock();
  return h;
}

function gymBlock(){
  const g = GYM[cursor] || {preset:"", sets:[]};
  const presets = SETTINGS.presets || {};
  const names = Object.keys(presets);
  const inPreset = !gymBuilding && g.preset && presets[g.preset];
  const list = inPreset ? presets[g.preset]
    : EX_DB.filter(x=>gymCat === "All" || x.c === gymCat).map(x=>x.n);

  let h = sh("On the gym floor", g.sets.length ? g.sets.length+" set"+(g.sets.length>1?"s":"") : "set by set");
  h += '<div class="card pad">'+
    '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px">'+
      '<span class="tag">Routine</span>'+
      '<button id="gNewPreset" class="tag lf" style="font-weight:600">'+(gymBuilding ? "" : "+ Build")+'</button>'+
    '</div>'+
    '<select id="gPreset" style="margin-top:8px"'+(gymBuilding?" disabled":"")+'>'+
      '<option value="">All exercises</option>'+
      names.map(n=>'<option value="'+esc(n)+'"'+(g.preset===n?" selected":"")+'>'+esc(n)+'</option>').join("")+
    '</select>';

  if(gymBuilding){
    h += '<div class="setform"><label class="f" style="margin-top:0"><span>New routine name</span>'+
      '<input type="text" id="gPresetName" placeholder="e.g. Push day"></label>'+
      '<p class="xs d3" style="margin-top:10px">Tap exercises below to add them. '+
        gymDraft.size+' selected.</p>'+
      '<div class="r2" style="margin-top:12px">'+
        '<button class="btn lift" id="gSavePreset" style="margin:0">Save routine</button>'+
        '<button class="btn g" id="gCancelPreset" style="margin:0">Cancel</button></div></div>';
  }

  if(!inPreset || gymBuilding){
    h += '<div class="catscroll">'+EX_CATS.map(c=>
      '<button class="catpill'+(c===gymCat?" on":"")+'" data-cat="'+c+'">'+c+'</button>').join("")+'</div>';
  } else {
    h += '<div style="height:12px"></div>';
  }

  h += '<div class="exgrid" id="gGrid">'+list.map(n=>{
    let cls = "";
    if(gymBuilding && gymDraft.has(n)) cls = "draft";
    else if(!gymBuilding && gymEx === n) cls = "on";
    return '<button class="'+cls+'" data-gex="'+esc(n)+'">'+esc(n)+'</button>';
  }).join("")+'</div>';

  if(gymEx && !gymBuilding){
    const prev = lastTimeFor(gymEx, cursor);
    const mine = g.sets.filter(s=>s.name === gymEx);
    const nextSet = mine.length ? Math.max(...mine.map(s=>s.s||0))+1 : 1;
    const best = prev ? Math.max(...prev.sets.map(s=>s.w||0)) : 0;
    let last;
    if(prev){
      const dd = parseISO(prev.date);
      last = 'Last on <b>'+DOW[dd.getDay()].slice(0,3)+' '+dd.getDate()+' '+MON[dd.getMonth()]+'</b> &nbsp; '+
        prev.sets.slice(0,5).map(s=>(s.w?r1(s.w):"–")+" × "+esc(s.r||"–")).join("&nbsp;&nbsp; ");
    } else {
      last = '<span style="opacity:.65">First time logging this one. Write down what you use.</span>';
    }
    h += '<div class="setform" id="gForm">'+
      '<div class="tag lf" style="margin-bottom:9px">'+esc(gymEx)+'</div>'+
      '<div class="lastline">'+last+'</div>'+
      '<div class="setgrid">'+
        '<label class="f"><span>Set</span><input type="number" id="gSet" inputmode="numeric" value="'+nextSet+'"></label>'+
        '<label class="f"><span>Kg</span><input type="number" id="gW" step="0.5" inputmode="decimal" value="'+
          (mine.length ? "" : (best||""))+'"></label>'+
        '<label class="f"><span>Reps</span><input type="text" id="gR" inputmode="numeric"></label>'+
        '<label class="f"><span>RPE</span><input type="number" id="gRpe" inputmode="numeric"></label>'+
      '</div>'+
      '<button class="btn lift" id="gLog">Log set</button></div>';
  }
  h += '</div>';

  h += '<div class="card" id="gLogList">'+(g.sets.length ? g.sets.map(s=>{
    let b = "";
    if(s.s) b += '<span class="badge s">Set '+s.s+'</span>';
    if(s.w) b += '<span class="badge">'+r1(s.w)+' kg</span>';
    if(s.r) b += '<span class="badge">'+esc(s.r)+' reps</span>';
    if(s.rpe) b += '<span class="badge">RPE '+s.rpe+'</span>';
    if(!b) b = '<span class="badge">Done</span>';
    return '<div class="ent" style="align-items:flex-start">'+
      '<div><div class="a">'+esc(s.name)+'</div><div>'+b+'</div></div>'+
      '<button class="del" data-gdel="'+esc(s.id)+'" aria-label="Remove">'+TRASH+'</button></div>';
  }).join("") : '<div class="pad xs d3">Nothing logged on the floor today. Tap an exercise above and '+
    'the last weights you used for it come back with it.</div>')+'</div>';
  return h;
}

function logBody(){

let charts = {};
const killCharts = ()=>{ Object.values(charts).forEach(c=>{try{c.destroy();}catch(e){}}); charts = {}; };

function loggedDates(){
  const keys = new Set(Object.keys(LOGS).concat(Object.keys(GYM)));
  return Array.from(keys).filter(d=>buildDay(d).touched).sort();
}
function weekKm(){ const m = weekStart(todayISO()); let k = 0;
  for(let i=0;i<7;i++){ const l = LOGS[addDays(m,i)]; if(l&&l.run&&l.run.distance_km) k += l.run.distance_km; }
  return k; }
function totalKm(){ return loggedDates().reduce((a,d)=>{
  const l = LOGS[d]; return a + (l && l.run && l.run.distance_km ? l.run.distance_km : 0); },0); }
function hardStats(){
  const st = SETTINGS.hardStart, N = SETTINGS.hardLength, t = todayISO();
  let best = 0, run = 0, perfect = 0;
  for(let i=0;i<N;i++){
    const dt = addDays(st,i); if(dt > t) break;
    if(buildDay(dt).hard75.all_pillars_met){ run++; perfect++; best = Math.max(best,run); } else run = 0;
  }
  const done = Math.max(0, Math.min(N, daysBetween(st,t)+1));
  return {current:run, best, perfect, left:Math.max(0,N-done), done};
}

function renderProgress(){
  killCharts();
  const dates = loggedDates(), t = todayISO();
  const st = hardStats(), p = weightPace(t), avg = rollingWeight(t,7);

  const ton = tonnage(weekStart(t), t);

    '<h1>Are you on track</h1></div>';

  h += '<div class="kpi">'+
    kpi(avg != null ? avg : "—","7-day avg kg",
      avg != null && p ? (p.ahead >= 0 ? "+"+p.ahead+" ahead of line" : r1(-p.ahead)+" behind line") : "needs 3 mornings",
      avg != null && p ? (p.ahead >= 0 ? "g" : "r") : "")+
    kpi(st.current,"streak","best "+st.best+" · "+st.left+" left", st.current?"a":"")+
    kpi(r1(weekKm()),"km this week","logged total "+r1(totalKm()),"t")+
    kpi(ton ? r1(ton/1000) : "—","tonnes lifted","this week, all sources","l")+
    kpi(daysBetween(t,SETTINGS.raceDate),"days to race",shortDate(SETTINGS.raceDate)+" · 21.1 km","a")+
    kpi(st.perfect,"perfect days","all four pillars","")+'</div>';

  /* 75 Hard calendar */

    : (hdn > SETTINGS.hardLength ? "complete" : hdn+" / "+SETTINGS.hardLength));
  h += '<div class="card pad">'+
    '<p class="xs d3" style="line-height:1.55">One square a day, shaded by how many pillars closed. '+
    'The two ticks underneath are the run and the lift. Tap any day to open it.</p>'+
    '<div class="dow"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div>'+
    '<div class="cal" id="cal"></div>'+
    '<div class="mkey" style="margin-top:12px">Less <i style="background:var(--s0);border:1px solid var(--line)"></i>'+
      '<i style="background:rgba(255,138,30,.16)"></i><i style="background:rgba(255,138,30,.34)"></i>'+
      '<i style="background:rgba(255,138,30,.56)"></i><i style="background:var(--amber)"></i> More'+
      '<span style="margin-left:auto"><i style="background:var(--run)"></i>run '+
      '<i style="background:var(--lift);margin-left:10px"></i>lift</span></div></div>';

  /* 80/20 */
  h += sh("Intensity split","last 4 weeks");
  h += '<div class="card pad">'+
    (sp && sp.km >= 15
      ? '<div class="meter"><i class="easy" data-w="'+sp.pct+'"></i><i class="hard" data-w="'+(100-sp.pct)+'"></i></div>'+
        '<div class="mkey"><span><i style="background:var(--run)"></i>Easy '+sp.pct+'%</span>'+
        '<span><i style="background:var(--amber)"></i>Threshold+ '+(100-sp.pct)+'%</span>'+
        '<span style="margin-left:auto">'+sp.km+' km</span></div>'+
        '<p class="xs d3" style="margin-top:11px;line-height:1.6">'+
          (sp.pct >= 76 && sp.pct <= 88
            ? "Sitting where it should. Roughly 80% easy is what the evidence supports, even for a half."
            : sp.pct < 76
            ? "Too much of this is hard. The fix is slowing the easy runs down, not cutting the workouts."
            : "Almost all easy. Comfortable, but the threshold work is the highest-return session in the block.")+'</p>'
      : '<div class="empty"><b>Building your split</b><span>Log a few runs with distance and this fills in.</span></div>')+
    '</div>';

  const ws = weightSeries(), fu = fuelSeries(), ps = paceSeries();
  h += sh("Weight")+'<div class="card pad">'+
    '<p class="xs d3" style="line-height:1.55">7-day rolling average against the straight line to '+
      SETTINGS.targetWeight+' kg by '+shortDate(SETTINGS.targetWeightDate)+'. Raw mornings sit faintly behind it.</p>'+
    cbox("cWeight", ws.labels.length >= 3, "Three logged mornings and the average draws.")+'</div>';

  h += sh("Fuel against load")+'<div class="card pad">'+
    '<p class="xs d3" style="line-height:1.55">Weekly calorie balance versus kilometres run. Bars below zero are a deficit.</p>'+
    cbox("cFuel", fu.labels.length >= 2, "Two weeks of food logs and this fills in.")+'</div>';

  h += sh("Distance")+'<div class="card pad">'+
    '<p class="xs d3" style="line-height:1.55">Weekly volume, planned against actual, across the block.</p>'+
    cbox("cRun", true, "")+'</div>';

  h += sh("Pace")+'<div class="card pad">'+
    '<p class="xs d3" style="line-height:1.55">Average pace per logged run. Lower is faster — but read it against the dew point, not in isolation.</p>'+
    cbox("cPace", ps.data.length >= 2, "Log two runs with a distance and a duration.")+'</div>';

  h += sh("Load lifted")+'<div class="card pad">'+
    '<p class="xs d3" style="line-height:1.55">Weekly tonnage: sets × reps × kilograms, from the prescribed sessions and the gym floor together.</p>'+
    cbox("cTon", tonSeries().labels.length >= 2, "Log weights on two separate weeks.")+'</div>';

  $("#v-progress").innerHTML = h;
  drawCalendar();
  requestAnimationFrame(()=>$$(".meter i").forEach(i=>i.style.width = i.dataset.w+"%"));
  drawWeight(); drawFuel(); drawRun(); drawPace(); drawTon();
}

function drawCalendar(){
  const g = $("#cal"); if(!g) return;
  const t = todayISO(), start = SETTINGS.hardStart, N = SETTINGS.hardLength;
  const lead = (parseISO(start).getDay()+6)%7;   /* Monday-first */
  let h = "";
  for(let i=0;i<lead;i++) h += '<div class="cell blank"></div>';
  for(let i=0;i<N;i++){
    const dt = addDays(start,i);
    const pr = plannedRun(dt), pl = plannedStrength(dt);
    const race = pr.type === "race";
    if(dt > t){
      h += '<button class="cell future'+(race?" race":"")+'" data-jump="'+dt+'">'+(i+1)+
        '<span class="bars"><i></i><i></i></span></button>';
      continue;
    }
    const day = buildDay(dt);
    const n = day.hard75.pillars.filter(p=>p.met).length;
    const runOk = pr.type !== "rest" && day.running.completed;
    const liftOk = !!pl && day.strength.completed;
    h += '<button class="cell'+(n?" p"+n:"")+(dt===t?" today":"")+(race?" race":"")+
      '" data-jump="'+dt+'" title="'+shortDate(dt)+' · '+n+'/4">'+(i+1)+
      '<span class="bars"><i class="'+(runOk?"run":"")+'"></i><i class="'+(liftOk?"lift":"")+'"></i></span></button>';
  }
  g.innerHTML = h;
  g.querySelectorAll("[data-jump]").forEach(b=>b.onclick = ()=>{
    if(b.dataset.jump > todayISO()) return toast("That day hasn't happened yet");
    cursor = b.dataset.jump; go("today");
  });
}

/* ---- series ---- */
function weightSeries(){
  const ds = loggedDates().filter(d=>LOGS[d] && LOGS[d].weight_kg != null);
  if(!ds.length) return {labels:[],raw:[],avg:[],line:[]};
  const first = ds[0], last = todayISO();
  const labels=[],rw=[],av=[],ln=[];
  const total = daysBetween(SETTINGS.blockStart, SETTINGS.targetWeightDate) || 1;
  for(let dt=first; dt<=last; dt=addDays(dt,1)){
    labels.push(shortDate(dt));
    rw.push(LOGS[dt] && LOGS[dt].weight_kg != null ? LOGS[dt].weight_kg : null);
    av.push(rollingWeight(dt,7));
    const k = Math.min(1,Math.max(0, daysBetween(SETTINGS.blockStart,dt)/total));
    ln.push(r1(SETTINGS.startWeight - (SETTINGS.startWeight-SETTINGS.targetWeight)*k));
  }
  return {labels,raw:rw,avg:av,line:ln};
}
function fuelSeries(){
  const ds = loggedDates(); if(!ds.length) return {labels:[],bal:[],km:[]};
  const labels=[],bal=[],km=[]; const end = weekStart(todayISO());
  for(let w = weekStart(ds[0]); w <= end; w = addDays(w,7)){
    const b = weekBalance(w); if(!b.days) continue;
    labels.push(shortDate(w)); bal.push(b.balance); km.push(b.km);
  }
  return {labels,bal,km};
}
function runSeries(){
  const labels=[],pl=[],ac=[];
  PLAN.weeks.forEach(w=>{
    labels.push("W"+w.w); pl.push(w.km);
    let a=0,any=false;
    for(let i=0;i<7;i++){ const l = LOGS[addDays(w.start,i)];
      if(l&&l.run&&l.run.distance_km){ a += l.run.distance_km; any = true; } }
    ac.push(any ? r1(a) : null);
  });
  return {labels,planned:pl,actual:ac};
}
function paceSeries(){
  const labels=[],data=[];
  loggedDates().forEach(d=>{ const r = LOGS[d] && LOGS[d].run;
    if(r && r.distance_km > 0 && r.duration_min > 0){ labels.push(shortDate(d)); data.push(r1(r.duration_min/r.distance_km)); } });
  return {labels,data};
}
function tonSeries(){
  const ds = loggedDates(); if(!ds.length) return {labels:[],data:[]};
  const labels=[],data=[]; const end = weekStart(todayISO());
  for(let w = weekStart(ds[0]); w <= end; w = addDays(w,7)){
    const t = tonnage(w, addDays(w,6));
    if(!t) continue;
    labels.push(shortDate(w)); data.push(r1(t/1000));
  }
  return {labels,data};
}

const V = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
/* If the chart library never arrived, degrade to a readable note rather than a blank box. */
function chartReady(el){

    'Everything else works \u2014 reload when you have a connection.</span></div>';

}
function opts(scales, legend){

let planTab = "weeks", openWeek = null;
function renderPlan(){
  const tabs = [["weeks","Weeks"],["lifts","Lifts"],["paces","Paces"],["hard","75 Hard"],["notes","Notes"]];
  const fns = {weeks:planWeeks, lifts:planLifts, paces:planPaces, hard:planHard, notes:planNotes};
  $("#v-plan").innerHTML =
    '<div class="hero"><div class="metarow"><span class="tag">'+PLAN.weeks.length+' weeks</span>'+DOT+
      '<span class="tag">'+r1(PLAN.weeks.reduce((a,w)=>a+w.km,0))+' km</span>'+DOT+
      '<span class="tag amb">'+shortDate(PLAN.race)+'</span></div>'+
    '<h1>The block</h1></div>'+
    '<div class="seg" id="planTabs">'+tabs.map(([k,l])=>
      '<button data-pt="'+k+'" aria-selected="'+(planTab===k)+'">'+l+'</button>').join("")+'</div>'+
    '<div id="planBody">'+fns[planTab]()+'</div>';
  wirePlan();
}
function planWeeks(){
  const now = weekFor(todayISO());
  return '<div class="callout"><b>7 September to 14 February.</b> Twenty-three weeks in six phases. '+
    'The first eleven overlap with 75 Hard; the twelve after it are where the race is actually won.</div>'+
    PLAN.phases.map(ph=>{
    const ws = PLAN.weeks.filter(w=>w.w>=ph.a && w.w<=ph.b);
    const lp = LIFT_PHASE[ph.n] || {};
    return '<div class="ph"><div class="phh"><h3>'+esc(ph.n)+'</h3>'+
      '<span>W'+ph.a+'–'+ph.b+' · '+r1(ws.reduce((a,w)=>a+w.km,0))+' km</span></div>'+
      '<p class="sm d3" style="margin-top:10px;line-height:1.6">'+esc(ph.d)+'</p>'+
      (lp.note ? '<p class="sm lf" style="margin-top:6px;line-height:1.6">Lifting — '+esc(lp.note)+'</p>' : '')+
      ws.map(w=>{
        const long = w.s.find(s=>s.k==="long"||s.k==="race");
        const key = w.s.find(s=>s.k==="quality"||s.k==="test"||s.k==="race") || w.s[0];
        return '<button class="wk'+(now && now.w===w.w ? " now" : "")+'" data-week="'+w.w+'">'+
          '<span class="wn">'+w.w+'</span><span class="wb">'+
          '<span class="wt">'+esc(key.t)+'</span>'+
          '<span class="wd">'+esc(w.label)+(long?' · long '+long.km+' km':'')+'</span></span>'+
          '<span class="wm">'+w.km+' km</span></button>'+
          (openWeek === w.w ? weekDetail(w) : "");
      }).join("")+'</div>';
  }).join("");
}
function weekDetail(w){
  const lifts = Object.keys(LIFT_DAYS).map(k=>LIFTS[LIFT_DAYS[k]].day.slice(0,3)+" "+LIFTS[LIFT_DAYS[k]].name.split(" · ")[0]);
  return '<div class="wkd">'+w.s.map(s=>
    '<div class="rr"><span>'+esc(s.day)+'</span><span>'+esc(s.t)+
      (s.d?'<em>'+esc(s.d)+'</em>':'')+'</span></div>').join("")+
    '<div class="rr"><span>Lift</span><span class="d3">'+esc(lifts.join(" · "))+'</span></div></div>';
}
