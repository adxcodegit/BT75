<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Block">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#0B0B0C">
<title>Block</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════════
   TYPE — two families, three sizes. Nothing else, anywhere.

   Fraunces  ...  display only, and only ever at --t1
   Plex Mono ...  everything else, at --t2 (body) or --t3 (label)

   --t2 is 16px because iOS zooms any input below that.
   ═══════════════════════════════════════════════════════════════════ */
:root{
  --t1:26px;   /* display: page titles, big metrics, the daily lead  */
  --t2:16px;   /* body: default for all running text and inputs      */
  --t3:12px;   /* label: captions, meta, table heads, nav, tags      */

  color-scheme:dark;
  --bg:#0B0B0C;
  --s1:#141416;
  --s2:#1C1C1F;
  --s0:#0F0F11;
  --nav-bg:#161618;
  --line:#26262A;
  --line-hi:#37373D;
  --ink:#EDE7DA;
  --ink-2:#A39C8D;
  --ink-3:#77726A;
  --dim:#77726A;
  --amber:#FF8A1E;
  --amber-2:#B4600F;
  --amber-soft:rgba(255,138,30,.10);
  --amber-glow:rgba(255,138,30,.28);
  --green:#E0D7C4;
  --red:#D2603F;
  --blue:#A29A8C;
  --violet:#6C665D;
  --serif:"Fraunces",Georgia,serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --gut:18px;
  --navh:80px;
  --r:20px;
  --e:cubic-bezier(.32,.72,.28,1);
}
[data-theme="light"]{
  color-scheme:light;
  --bg:#E9E3D6; --s1:#F7F3EA; --s2:#F0EBDE; --s0:#DED7C6; --nav-bg:#F7F3EA;
  --line:#D5CDBB; --line-hi:#BCB3A0;
  --ink:#16161A; --ink-2:#4E4A42; --ink-3:#7C766B; --dim:#7C766B;
  --amber:#B35A00; --amber-2:#8A4500; --amber-soft:rgba(179,90,0,.10); --amber-glow:rgba(179,90,0,.20);
  --green:#8A8272; --red:#B0442A; --blue:#6F6A60; --violet:#403C36;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{
  background:var(--bg);color:var(--ink);
  font-family:var(--mono);font-size:var(--t2);line-height:1.55;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;
  transition:background .35s var(--e),color .35s var(--e);
}
button,input,select,textarea{font-family:inherit;font-size:var(--t2);color:inherit}
button{border:0;background:none;cursor:pointer}
::selection{background:var(--amber);color:var(--bg)}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px;border-radius:10px}

/* Scrollbars — 16px instead of the 4px hairline so the thumb is actually
   grabbable with a mouse. Scoped to pointer:fine: touch devices use overlay
   scrollbars that cost no layout width, and styling them would make every
   scroll area permanently 16px narrower on the phone. */
@media (pointer:fine){
  *{scrollbar-width:auto;scrollbar-color:var(--amber) var(--s0)}
  ::-webkit-scrollbar{width:16px;height:16px}
  ::-webkit-scrollbar-track{background:var(--s0);border-radius:99px}
  ::-webkit-scrollbar-thumb{background:var(--amber);border-radius:99px;
    border:3px solid var(--s0);background-clip:padding-box;min-height:48px;min-width:48px}
  ::-webkit-scrollbar-thumb:hover{background:var(--amber-2)}
  ::-webkit-scrollbar-corner{background:transparent}
}

/* the only three type classes in the app */
.t1{font-family:var(--serif);font-size:var(--t1);font-weight:600;line-height:1.14;
  letter-spacing:-.028em;font-variation-settings:"opsz" 72;font-variant-numeric:tabular-nums}
.t3,.lbl{font-size:var(--t3);line-height:1.5}
.lbl{letter-spacing:.11em;text-transform:uppercase;color:var(--dim);font-weight:500}
h1{font-family:var(--serif);font-size:var(--t1);font-weight:600;line-height:1.14;
  letter-spacing:-.028em;font-variation-settings:"opsz" 72}
h2,h3{font-size:var(--t3);letter-spacing:.11em;text-transform:uppercase;color:var(--dim);font-weight:500;
  font-family:var(--mono);line-height:1.5}
.sm,.xs,.tag{font-size:var(--t3);line-height:1.5}
.tag{letter-spacing:.11em;text-transform:uppercase;color:var(--dim);font-weight:500}
.d2{color:var(--ink-2)} .d3{color:var(--dim)} .amb{color:var(--amber)}
.num{font-variant-numeric:tabular-nums}

#app{max-width:460px;margin:0 auto;min-height:100dvh;overflow-x:clip}
main{padding:0 var(--gut) calc(var(--navh) + env(safe-area-inset-bottom) + 26px);
  overflow-x:clip;max-width:100%}

/* ── header ────────────────────────────────────────────── */
.hdr{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;
  padding:calc(env(safe-area-inset-top) + 14px) var(--gut) 12px;
  background:linear-gradient(var(--bg) 68%,transparent)}
.hdr .mark{font-family:var(--serif);font-size:var(--t2);font-weight:600;letter-spacing:-.02em;
  flex:1;min-width:0;line-height:1.2}
.hdr .mark i{font-style:normal;color:var(--amber)}
.hdr .mark span{display:block;font-family:var(--mono);font-size:var(--t3);letter-spacing:.09em;
  text-transform:uppercase;color:var(--dim);margin-top:3px;font-weight:500}
.ib{width:42px;height:42px;border-radius:50%;background:var(--s1);border:1px solid var(--line);
  display:grid;place-items:center;color:var(--ink-2);flex:0 0 auto;transition:.2s var(--e)}
.ib:active{transform:scale(.9);color:var(--amber);border-color:var(--amber-2)}
.ib svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
.ib.sm2{width:38px;height:38px}
.ib.sm2 svg{width:16px;height:16px}
.ib[disabled]{opacity:.3}

.view{display:none}
.view.on{display:block;animation:vin .34s var(--e)}
@keyframes vin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ── hero ──────────────────────────────────────────────── */
.hero{padding:4px 0 2px}
.metarow{display:flex;align-items:center;gap:9px;margin-bottom:14px;flex-wrap:wrap}
.metarow .dot{width:3px;height:3px;border-radius:50%;background:var(--line-hi);flex:0 0 auto}
.pillbadge{font-size:var(--t3);letter-spacing:.09em;text-transform:uppercase;font-weight:500;
  padding:5px 11px;border-radius:99px;background:var(--amber-soft);color:var(--amber);
  border:1px solid var(--amber-2);white-space:nowrap;display:inline-block}
.lead{font-family:var(--serif);font-size:var(--t1);line-height:1.34;font-weight:500;
  letter-spacing:-.02em;font-variation-settings:"opsz" 48}
.lead b{font-weight:600;color:var(--amber)}
.leadwrap{position:relative;padding-left:17px;margin:2px 0 4px;animation:lead .55s var(--e)}
.leadwrap::before{content:"";position:absolute;left:0;top:5px;bottom:5px;width:3px;border-radius:99px;
  background:linear-gradient(var(--amber),var(--amber-2))}
@keyframes lead{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}

.notes{margin-top:18px;display:flex;flex-direction:column;gap:10px}
.note{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:13px 15px;
  font-size:var(--t3);line-height:1.6;color:var(--ink-2)}
.note b{display:block;font-size:var(--t3);letter-spacing:.11em;text-transform:uppercase;
  color:var(--dim);margin-bottom:5px;font-weight:500}
.note.warn{border-color:rgba(210,96,63,.34);background:rgba(210,96,63,.05);color:var(--ink)}
.note.warn b{color:var(--red)}

/* ── section head ──────────────────────────────────────── */
.sh{display:flex;align-items:center;gap:12px;margin:34px 0 0}
.sh h2{flex:0 0 auto;color:var(--ink)}
.sh .rule{flex:1;height:1px;background:var(--line)}
.sh .r{flex:0 0 auto;font-size:var(--t3);color:var(--dim);font-variant-numeric:tabular-nums}

.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);margin-top:14px;
  overflow:hidden;box-shadow:0 1px 0 rgba(255,255,255,.03) inset}
[data-theme="light"] .card{box-shadow:0 1px 2px rgba(30,26,14,.05)}
.pad{padding:17px}

/* ── session rows ──────────────────────────────────────── */
.sess{margin-top:14px;border-radius:var(--r);overflow:hidden;background:var(--s1);border:1px solid var(--line)}
.srow{display:flex;align-items:center;gap:14px;padding:17px;position:relative;transition:background .2s var(--e)}
.srow+.srow,.exp+.srow{border-top:1px solid var(--line)}
.srow.done{background:var(--amber-soft)}
.sbody{flex:1;min-width:0;text-align:left}
.sbody .k{display:flex;align-items:baseline;gap:8px}
.sbody .k b{font-family:var(--serif);font-size:var(--t1);font-weight:600;letter-spacing:-.035em;
  line-height:1;font-variant-numeric:tabular-nums}
.sbody .k i{font-style:normal;font-size:var(--t3);color:var(--dim);letter-spacing:.1em;text-transform:uppercase}
.sbody .t{font-size:var(--t2);margin-top:8px;line-height:1.4}
.sbody .n{font-size:var(--t3);color:var(--dim);margin-top:4px;line-height:1.5}
.srow.done .sbody .t{color:var(--ink-2)}
.tick{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line-hi);flex:0 0 auto;
  display:grid;place-items:center;background:var(--s0);
  transition:background .3s var(--e),border-color .3s var(--e),transform .3s var(--e),box-shadow .3s}
.tick svg{width:18px;height:18px;stroke:var(--bg);fill:none;stroke-width:3;stroke-linecap:round;
  stroke-linejoin:round;opacity:0;transform:scale(.4);transition:.28s var(--e)}
.done .tick{background:var(--amber);border-color:var(--amber);box-shadow:0 0 0 5px var(--amber-soft)}
.done .tick svg{opacity:1;transform:scale(1)}
.tick.pop{animation:pop .5s var(--e)}
@keyframes pop{0%{transform:scale(1)}38%{transform:scale(1.26)}100%{transform:scale(1)}}
.chev{flex:0 0 auto;color:var(--dim);transition:transform .32s var(--e)}
.chev svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;
  stroke-linejoin:round;display:block}
.isopen .chev{transform:rotate(90deg);color:var(--amber)}

.exp{display:grid;grid-template-rows:0fr;transition:grid-template-rows .36s var(--e)}
.exp.open{grid-template-rows:1fr}
.exp>div{overflow:hidden}
.expin{padding:6px 17px 18px;border-top:1px solid var(--line)}

.ex{display:flex;align-items:center;gap:12px;padding:12px 0}
.ex+.ex{border-top:1px solid var(--line)}
.ex .xb{flex:1;min-width:0}
.ex .xn{font-size:var(--t2);line-height:1.35;overflow-wrap:anywhere}
.ex .xd{font-size:var(--t3);color:var(--dim);margin-top:3px;line-height:1.5}
.ex .xr{flex:0 0 auto;font-size:var(--t3);color:var(--ink-2);font-variant-numeric:tabular-nums;text-align:right}
.mini{width:38px;height:38px;border-radius:11px;border:1.5px solid var(--line-hi);display:grid;
  place-items:center;color:var(--dim);background:var(--s0);flex:0 0 auto;transition:.22s var(--e)}
.mini.on{background:var(--amber);border-color:var(--amber);color:var(--bg)}
.mini svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.8;
  stroke-linecap:round;stroke-linejoin:round}
.grp{font-size:var(--t3);letter-spacing:.12em;text-transform:uppercase;color:var(--amber);
  padding:17px 0 4px;font-weight:600}
.grp.first{padding-top:9px}

/* ── fuel ──────────────────────────────────────────────── */
.fuel{margin-top:14px;background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:18px 17px}
.fr{display:flex;align-items:center;gap:18px}
.ring{position:relative;flex:0 0 108px;width:108px;height:108px}
.ring svg{width:108px;height:108px;transform:rotate(-90deg);display:block}
.ring circle{fill:none;stroke-width:9;stroke-linecap:round}
.ring .trk{stroke:var(--s0)}
.ring .val{stroke:var(--amber);transition:stroke-dashoffset .9s var(--e),stroke .3s;
  filter:drop-shadow(0 0 6px var(--amber-glow))}
.ring .val.over{stroke:var(--red)}
.ring .mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .mid b{font-family:var(--serif);font-size:var(--t1);font-weight:600;letter-spacing:-.04em;
  display:block;line-height:1;font-variant-numeric:tabular-nums}
.ring .mid span{font-size:var(--t3);letter-spacing:.09em;text-transform:uppercase;color:var(--dim);
  display:block;margin-top:6px}
.mac{flex:1;min-width:0;display:flex;flex-direction:column;gap:13px}
.mac .rr{display:flex;justify-content:space-between;align-items:baseline;font-size:var(--t3);margin-bottom:6px}
.mac .rr b{font-weight:500;font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--s0);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;width:0;transition:width .85s var(--e)}
.bar i.p{background:var(--green)} .bar i.c{background:var(--blue)} .bar i.f{background:var(--violet)}

/* ── pillars ───────────────────────────────────────────── */
.pill{display:flex;align-items:center;gap:13px;padding:15px 17px;position:relative;overflow:hidden}
.pill.done{background:var(--amber-soft)}
.pb{flex:1;min-width:0}
.pb .pn{font-size:var(--t2);line-height:1.3}
.pb .pd{font-size:var(--t3);color:var(--dim);margin-top:3px}
.pill .prg{position:absolute;left:0;bottom:0;height:2px;background:var(--amber);width:0;
  transition:width .6s var(--e)}
/* one big tap target instead of a +/- stepper */
.hval{flex:0 0 auto;min-width:80px;height:46px;border-radius:13px;border:1.5px solid var(--line-hi);
  background:var(--s0);display:flex;align-items:center;justify-content:center;gap:5px;
  font-variant-numeric:tabular-nums;transition:.22s var(--e)}
.hval b{font-size:var(--t2);font-weight:600}
.hval i{font-style:normal;font-size:var(--t3);color:var(--dim)}
.hval:active{border-color:var(--amber)}
.pill.done .hval{border-color:var(--amber-2);color:var(--amber)}
.pill.open .hval{border-color:var(--amber);background:var(--amber-soft)}
.pstat{flex:0 0 auto;font-size:var(--t3);color:var(--dim);text-align:right;max-width:104px;line-height:1.4}
.presets{display:grid;grid-template-rows:0fr;transition:grid-template-rows .32s var(--e);
  background:var(--s0)}
.presets.open{grid-template-rows:1fr}
.presets>div{overflow:hidden}
.pin{display:flex;flex-wrap:wrap;gap:8px;padding:14px 17px 16px;border-top:1px solid var(--line)}
.pin button{flex:1 1 auto;min-width:58px;height:44px;border-radius:12px;border:1.5px solid var(--line-hi);
  background:var(--s1);font-size:var(--t2);font-variant-numeric:tabular-nums;color:var(--ink-2);
  transition:.2s var(--e)}
.pin button.tgt{border-color:var(--amber-2);color:var(--amber)}
.pin button.on{background:var(--amber);border-color:var(--amber);color:#0B0B0C;font-weight:600}
.pin button.nil{color:var(--dim);font-size:var(--t3)}

/* ── segmented control ─────────────────────────────────── */
.seg{display:flex;gap:4px;margin-top:16px;padding:5px;background:var(--s0);border:1px solid var(--line);
  border-radius:16px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 1 0;min-width:56px;padding:12px 8px;border-radius:12px;font-size:var(--t3);
  color:var(--ink-2);white-space:nowrap;transition:.24s var(--e);font-weight:500;letter-spacing:.04em}
.seg button[aria-selected="true"]{background:var(--amber);color:#0B0B0C;font-weight:600;
  box-shadow:0 2px 10px var(--amber-glow)}

/* ── forms ─────────────────────────────────────────────── */
label.f{display:block;margin-top:16px}
label.f>span{display:block;font-size:var(--t3);letter-spacing:.11em;text-transform:uppercase;
  color:var(--dim);margin-bottom:8px;font-weight:500}
input[type=text],input[type=number],input[type=date],select,textarea{
  width:100%;background:var(--s0);border:1.5px solid var(--line);color:var(--ink);border-radius:13px;
  padding:14px;font-size:var(--t2);transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--amber);box-shadow:0 0 0 4px var(--amber-soft)}
input::placeholder{color:var(--dim)}
textarea{resize:vertical;min-height:76px;line-height:1.5}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{width:100%;background:var(--amber);color:#0B0B0C;border-radius:14px;padding:16px;
  font-size:var(--t2);font-weight:600;margin-top:16px;transition:transform .12s var(--e);
  box-shadow:0 3px 14px var(--amber-glow)}
.btn:active{transform:scale(.98)}
.btn.g{background:transparent;border:1.5px solid var(--line-hi);color:var(--ink-2);font-weight:500;box-shadow:none}
.btn.dg{background:transparent;border:1.5px solid var(--red);color:var(--red);font-weight:500;box-shadow:none}

.quick{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-top:12px}
.quick::-webkit-scrollbar{display:none}
.quick button{flex:0 0 auto;padding:11px 15px;border-radius:99px;border:1px solid var(--line-hi);
  background:var(--s1);font-size:var(--t3);color:var(--ink-2);white-space:nowrap}
.quick button:active{border-color:var(--amber);color:var(--amber)}

.res{margin-top:11px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--s1);
  max-height:270px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.res:empty{display:none}
.fr2{display:flex;justify-content:space-between;align-items:center;gap:11px;width:100%;text-align:left;
  padding:14px 15px;transition:background .15s}
.fr2+.fr2{border-top:1px solid var(--line)}
.fr2.sel{background:var(--amber-soft);box-shadow:inset 3px 0 0 var(--amber)}
.fr2 .a{font-size:var(--t2)} .fr2 .b{font-size:var(--t3);color:var(--dim);margin-top:2px}
.fr2 .k{font-size:var(--t3);color:var(--amber);font-variant-numeric:tabular-nums;flex:0 0 auto}
.ent{display:flex;justify-content:space-between;align-items:center;gap:11px;padding:14px 15px}
.ent+.ent{border-top:1px solid var(--line)}
.ent .a{font-size:var(--t2)} .ent .b{font-size:var(--t3);color:var(--dim);margin-top:2px}
.ent .rt{display:flex;align-items:center;gap:12px;flex:0 0 auto}
.ent .kc{font-size:var(--t3);font-variant-numeric:tabular-nums}
.del{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:var(--dim);
  border:1px solid var(--line)}
.del:active{color:var(--red);border-color:var(--red)}
.del svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round}
.ent.rm{animation:rmo .26s var(--e) forwards}
@keyframes rmo{to{opacity:0;transform:translateX(-16px);height:0;padding:0}}

/* strength logger — name on its own line, inputs full width beneath */
.lrow{padding:15px 0}
.lrow+.lrow{border-top:1px solid var(--line)}
.lrow .lname{font-size:var(--t2);line-height:1.3;overflow-wrap:anywhere}
.lrow .lsub{font-size:var(--t3);color:var(--dim);margin-top:4px;line-height:1.45}
.lrow .lsub b{color:var(--ink-2);font-weight:500}
.lin{display:grid;grid-template-columns:1fr 1fr 1fr 50px;gap:8px;margin-top:12px;align-items:stretch}
.lin .fld{position:relative}
.lin .fld span{position:absolute;top:-7px;left:10px;padding:0 5px;background:var(--s1);
  font-size:var(--t3);transform:scale(.82);transform-origin:left center;letter-spacing:.1em;
  text-transform:uppercase;color:var(--dim);z-index:1}
.lin input{width:100%;padding:13px 6px;text-align:center;border-radius:12px}
.lin .mini{width:50px;height:100%;min-height:50px;border-radius:12px}

table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:var(--t3);font-weight:500;letter-spacing:.11em;text-transform:uppercase;
  color:var(--dim);padding:14px 12px 10px;border-bottom:1px solid var(--line)}
td{padding:13px 12px;border-bottom:1px solid var(--line);font-size:var(--t3);vertical-align:top;
  line-height:1.5;overflow-wrap:anywhere}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}

/* ── trend ─────────────────────────────────────────────── */
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);
  border-radius:var(--r);overflow:hidden;margin-top:14px}
.kpi>div{background:var(--s1);padding:16px}
.kpi b{font-family:var(--serif);font-size:var(--t1);font-weight:600;letter-spacing:-.035em;display:block;
  line-height:1.05;font-variant-numeric:tabular-nums}
.kpi b.g{color:var(--green)} .kpi b.r{color:var(--red)} .kpi b.a{color:var(--amber)}
.kpi span{font-size:var(--t3);letter-spacing:.1em;text-transform:uppercase;color:var(--dim);
  display:block;margin-top:8px}
.kpi em{font-style:normal;font-size:var(--t3);color:var(--ink-2);display:block;margin-top:3px;line-height:1.45}
.cbox{position:relative;height:190px;margin-top:12px}
.empty{display:grid;place-content:center;text-align:center;gap:6px;height:140px;
  border:1.5px dashed var(--line-hi);border-radius:15px;color:var(--dim);font-size:var(--t3);
  padding:18px;margin-top:12px}
.empty b{font-family:var(--serif);font-size:var(--t2);font-weight:600;color:var(--ink-2)}

.meter{height:14px;border-radius:99px;overflow:hidden;display:flex;background:var(--s0);margin-top:14px}
.meter i{display:block;height:100%;transition:width .9s var(--e)}
.meter i.easy{background:var(--green)} .meter i.hard{background:var(--amber)}
.mkey{display:flex;gap:16px;margin-top:12px;font-size:var(--t3);color:var(--dim);align-items:center}
.mkey i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:6px;vertical-align:middle}

.sgrid{display:grid;grid-template-columns:repeat(15,1fr);gap:5px;margin-top:14px}
.sq{aspect-ratio:1;border-radius:3px;background:var(--s0);border:1px solid transparent;transition:.2s var(--e)}
.sq.p1{background:rgba(255,138,30,.24)} .sq.p2{background:rgba(255,138,30,.46)}
.sq.p3{background:rgba(255,138,30,.70)} .sq.p4{background:var(--amber)}
.sq.today{border-color:var(--ink-2)}
.sq.future{background:transparent;border:1px solid var(--line)}
.sq:active{transform:scale(1.25)}

/* ── plan ──────────────────────────────────────────────── */
.ph{margin-top:30px}
.phh{display:flex;align-items:baseline;gap:10px;padding-bottom:10px;border-bottom:1.5px solid var(--amber-2)}
.phh h3{color:var(--amber);font-size:var(--t3);letter-spacing:.13em;font-weight:600}
.phh span{margin-left:auto;font-size:var(--t3);color:var(--dim);white-space:nowrap}
.phh h3{min-width:0;overflow-wrap:anywhere}
.wk{width:100%;text-align:left;display:flex;gap:13px;align-items:flex-start;padding:15px 4px}
.wk+.wk,.wkd+.wk{border-top:1px solid var(--line)}
.wk .wn{flex:0 0 26px;font-family:var(--serif);font-size:var(--t2);font-weight:600;color:var(--amber);
  line-height:1.25;font-variant-numeric:tabular-nums}
.wk .wb{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.wk .wt{display:block;font-size:var(--t2);line-height:1.35;overflow-wrap:anywhere}
.wk .wd{display:block;font-size:var(--t3);color:var(--dim);line-height:1.45}
.wk .wm{flex:0 0 auto;font-size:var(--t3);color:var(--ink-2);font-variant-numeric:tabular-nums;padding-top:2px}
.wk.now{background:var(--amber-soft);box-shadow:inset 3px 0 0 var(--amber);border-radius:0 10px 10px 0}
.wkd{padding:0 0 14px 39px}
.wkd .rr{display:flex;gap:11px;padding:9px 0;font-size:var(--t3);border-top:1px solid var(--line)}
.wkd .rr span:last-child{min-width:0;overflow-wrap:anywhere}
.wkd .rr span:first-child{flex:0 0 34px;color:var(--dim);letter-spacing:.09em;text-transform:uppercase}
.wkd em{font-style:normal;color:var(--dim);display:block;margin-top:2px}

.acc+.acc{border-top:1px solid var(--line)}
.acch{display:flex;width:100%;text-align:left;justify-content:space-between;align-items:center;gap:12px;
  padding:17px;font-size:var(--t2);line-height:1.35}
.acch .pm{color:var(--dim);font-size:var(--t2);line-height:1;transition:transform .3s var(--e);flex:0 0 auto}
.acc.open .acch .pm{transform:rotate(45deg);color:var(--amber)}
.accb{display:grid;grid-template-rows:0fr;transition:grid-template-rows .32s var(--e)}
.acc.open .accb{grid-template-rows:1fr}
.accb>div{overflow:hidden}
.accb .in{padding:0 17px 17px;font-size:var(--t3);color:var(--ink-2);line-height:1.7}

.callout{background:var(--amber-soft);border:1px solid var(--amber-2);border-radius:16px;padding:15px 16px;
  font-size:var(--t3);color:var(--ink-2);line-height:1.65;margin-top:14px}
.callout b{color:var(--amber);font-weight:600}

/* ── floating nav — deliberately thick, 56px tap targets ── */
nav{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 10px);z-index:50;
  display:flex;justify-content:center;pointer-events:none;padding:0 var(--gut)}
nav .bar{pointer-events:auto;position:relative;display:flex;padding:7px;border-radius:24px;
  background:var(--nav-bg);border:1px solid var(--line-hi);
  box-shadow:0 14px 40px rgba(0,0,0,.6),0 1px 0 rgba(255,255,255,.05) inset;
  width:100%;max-width:424px}
[data-theme="light"] nav .bar{box-shadow:0 12px 32px rgba(40,34,18,.18)}
@supports (backdrop-filter:blur(1px)){
  nav .bar{backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6)}
}
nav .glide{position:absolute;top:7px;bottom:7px;left:7px;width:calc((100% - 14px)/4);border-radius:18px;
  background:var(--amber-soft);border:1px solid var(--amber-2);transition:transform .38s var(--e);z-index:0}
nav button{flex:1;padding:11px 0 9px;display:flex;flex-direction:column;align-items:center;gap:6px;
  font-size:var(--t3);letter-spacing:.08em;text-transform:uppercase;color:var(--dim);
  transition:color .28s var(--e);position:relative;z-index:1;font-weight:500;min-height:56px}
nav button[aria-selected="true"]{color:var(--amber)}
nav svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}

/* ── sheet ─────────────────────────────────────────────── */
.scrim{position:fixed;inset:0;background:rgba(4,5,8,.66);z-index:60;opacity:0;pointer-events:none;
  transition:opacity .3s var(--e);backdrop-filter:blur(4px)}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--bg);
  border-top:1px solid var(--line-hi);border-radius:26px 26px 0 0;max-height:92dvh;overflow-y:auto;
  -webkit-overflow-scrolling:touch;transform:translateY(101%);transition:transform .38s var(--e);
  max-width:460px;margin:0 auto;padding:0 var(--gut) calc(env(safe-area-inset-bottom) + 30px)}
.sheet.on{transform:none}
.grab{width:44px;height:5px;border-radius:99px;background:var(--line-hi);margin:12px auto 2px}
.shd{display:flex;align-items:center;justify-content:space-between;padding:12px 0 6px;
  position:sticky;top:0;background:var(--bg);z-index:2}
.shd h2{color:var(--ink)}

#toast{position:fixed;left:50%;bottom:calc(var(--navh) + env(safe-area-inset-bottom) + 22px);
  transform:translate(-50%,14px);z-index:70;background:var(--s2);border:1px solid var(--line-hi);
  border-radius:99px;padding:12px 20px;font-size:var(--t3);opacity:0;pointer-events:none;
  transition:opacity .25s var(--e),transform .32s var(--e);box-shadow:0 10px 30px rgba(0,0,0,.5);
  white-space:nowrap;max-width:88vw;overflow:hidden;text-overflow:ellipsis}
#toast.on{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
/* below iPhone-16 width (SE, mini) */
@media (max-width:374px){
  :root{--gut:14px;--t1:23px}
  .lin{grid-template-columns:1fr 1fr 1fr 46px;gap:6px}
  .hval{min-width:70px}
  .ring{flex:0 0 96px;width:96px;height:96px}
  .ring svg{width:96px;height:96px}
}
</style>
</head>

      return raw === null ? fallback : JSON.parse(raw); }
    catch(e){ STORAGE_OK = false; return fallback; }
  },
  set(key, value){
    try{ localStorage.setItem(key, JSON.stringify(value)); return true; }
    catch(e){ STORAGE_OK = false; toast("Not saved — storage is full or blocked"); return false; }
  }
};

  blockStart: PLAN.start,
  hardStart: "2026-08-27",
  hardLength: 75,
  targetWeight: 75,
  targetWeightDate: "2026-12-31",
  startWeight: 90,
  tdeeFactor: 31,      // kcal per kg per day
  deficit: 680,        // kcal below TDEE on a full deficit day
  proteinPerKg: 1.8,
  fatPerKg: 0.75,
  growthTarget: 2,     // personal growth, every day
  cfaWeekday: 1.5,     // CFA L2 — Mon–Fri
  cfaWeekend: 3,       // CFA L2 — Sat/Sun
  sleepTarget: 7,

let LOGS = {};       // { "YYYY-MM-DD": <lean stored log> }
let SETTINGS = {};
let CUSTOM_FOODS = [];
let cursor = null;   // date being viewed, YYYY-MM-DD
let view = "today";

/* ═══════════════════════════════════════════════════════════════
   DATES
   ═══════════════════════════════════════════════════════════════ */
const pad2 = n => String(n).padStart(2,"0");
const iso = d => d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());
const parseISO = s => new Date(s+"T00:00:00");
const todayISO = () => iso(new Date());
function addDays(s,n){ const d = parseISO(s); d.setDate(d.getDate()+n); return iso(d); }
function daysBetween(a,b){ return Math.round((parseISO(b)-parseISO(a))/86400000); }
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DOW = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
function pretty(s){ const d = parseISO(s); return DOW[d.getDay()]+", "+d.getDate()+" "+MON[d.getMonth()]; }
function shortDate(s){ const d = parseISO(s); return d.getDate()+" "+MON[d.getMonth()]; }
const r0 = n => Math.round(n);
const r1 = n => Math.round(n*10)/10;

/* ═══════════════════════════════════════════════════════════════
   PRESCRIPTION — what the block asks of a given date
   ═══════════════════════════════════════════════════════════════ */
const SESSION_BY_DATE = {};
const WEEK_BY_DATE = {};
PLAN.weeks.forEach(w=>{
  w.s.forEach(s=>{ SESSION_BY_DATE[s.date] = s; });
  for(let i=0;i<7;i++) WEEK_BY_DATE[addDays(w.start,i)] = w;
});
const weekFor = d => WEEK_BY_DATE[d] || null;
function phaseLabel(date){
  const w = weekFor(date);
  if(w) return {w:"Wk "+w.w, phase:w.phase};
  if(inPreBlock(date)) return {w:"Base", phase:"Pre-block"};
  return null;
}

/* Before the block proper opens, a base week keyed to weekday. This is the
   heat-acclimatisation ramp — short, easy, every other day. */
const PRE_WEEK = {
 0:{km:5, t:"5 km easy",              k:"easy", d:"Effort, not pace. Expect a high heart rate."},
 1:{km:0, t:"Rest",                   k:"rest", d:""},
 2:{km:4, t:"4 km easy",              k:"easy", d:"Conversational the whole way."},
 3:{km:0, t:"Rest",                   k:"rest", d:""},
 4:{km:4, t:"4 km easy + 4 strides",  k:"easy", d:"Strides: 20 s fast and relaxed, 60 s walk."},
 5:{km:0, t:"Rest",                   k:"rest", d:""},
 6:{km:5, t:"5 km easy",              k:"easy", d:"Same route each week — it becomes your benchmark."}
};
function inPreBlock(date){
  return date >= SETTINGS.hardStart && date < SETTINGS.blockStart;
}
function plannedRun(date){
  const s = SESSION_BY_DATE[date];
  if(s) return {type:s.k, distance_km:s.km, title:s.t, detail:s.d, pace:paceBand(s.k)};
  if(inPreBlock(date)){
    const p = PRE_WEEK[parseISO(date).getDay()];
    return {type:p.k, distance_km:p.km, title:p.t, detail:p.d, pace:paceBand(p.k), pre:true};
  }
  return {type:"rest", distance_km:0, title:"Rest", detail:"No run scheduled.", pace:null};
}
function plannedStrength(date){
  const w = weekFor(date);
  const wd = parseISO(date).getDay();
  if(!w){
    /* outside the running block but inside the challenge: lift as normal */
    if(!inPreBlock(date)) return null;
    const k = LIFT_DAYS[wd];
    return k ? Object.assign({}, LIFTS[k], {phase:LIFT_PHASE["Foundation"]}) : null;
  }
  const ph = LIFT_PHASE[w.phase] || {tag:"Build", note:""};
  if(w.phase === "Taper"){
    /* Race week and the one before: Monday only, deliberately light. */
    if(wd !== 1) return null;
    return Object.assign({}, LIFTS.UA, {phase:ph, light:true});
  }
  if(w.phase === "Race specific" && wd === 6) return null;   /* Saturday lower is dropped */
  const k = LIFT_DAYS[wd];
  return k ? Object.assign({}, LIFTS[k], {phase:ph}) : null;
}
/* Flat list of every prescribed exercise, in order, for the logger. */
function liftExercises(l){
  if(!l) return [];
  const out = [];
  l.groups.forEach(g=>g.ex.forEach(e=>out.push(Object.assign({group:g.g}, e))));
  return out;
}
function paceBand(kind){
  const map = {easy:"Easy", long:"Long run", steady:"Steady", quality:"Threshold",
               test:"Threshold", race:"Threshold"};
  const row = PLAN.zones.find(z=>z[0] === map[kind]);
  return row ? row[3] : null;   /* goal-fitness column */
}

/* ── heat ──────────────────────────────────────────────────────────────
   Dew point in, seconds per kilometre out. WEATHER is filled by a single
   fetch on load; everything degrades to SETTINGS.manualDew if it fails. */
let WEATHER = null;   /* {dew, temp, at} */
function dewBand(dew){
  return DEW_BANDS.find(b=>dew <= b.max) || DEW_BANDS[DEW_BANDS.length-1];
}
function currentDew(){
  if(SETTINGS.autoWeather && WEATHER && typeof WEATHER.dew === "number") return WEATHER.dew;
  return SETTINGS.manualDew;
}
function parsePace(str){          /* "9:00–9:45" -> [540, 585] */
  if(!str) return null;
  const parts = String(str).split(/[–\-]/).map(x=>x.trim()).filter(Boolean);
  const secs = parts.map(p=>{ const m = p.split(":"); return (+m[0])*60 + (+(m[1]||0)); });
  return secs.length === 2 ? secs : (secs.length === 1 ? [secs[0], secs[0]] : null);
}
function paceStr(v){ const m = Math.floor(v), s = Math.round((v-m)*60);
  return s === 60 ? (m+1)+":00" : m+":"+pad2(s); }
function fmtBand(secs){ return paceStr(secs[0]/60)+"–"+paceStr(secs[1]/60); }
/* Prescribed band, plus what today's heat actually makes it. */
function adjustedPace(kind){
  const raw = parsePace(paceBand(kind));
  if(!raw) return null;
  const dew = currentDew(), band = dewBand(dew);
  return {raw, dew, band, adj:[raw[0]+band.pen, raw[1]+band.pen]};
}
const isTaper = date => {
  const dl = daysBetween(date, SETTINGS.raceDate);
  return dl >= 0 && dl <= 21;
};

/* ═══════════════════════════════════════════════════════════════
   CALORIE TARGET — TDEE from bodyweight, deficit scaled by the
   training cost of the day. Long runs and the taper get fed.
   ═══════════════════════════════════════════════════════════════ */
function currentWeight(date){
  const avg = rollingWeight(date, 7);
  if(avg != null) return avg;
  const last = lastWeightOnOrBefore(date);
  return last != null ? last : SETTINGS.startWeight;
}
function calorieTarget(date){
  const w = currentWeight(date);
  const tdee = w * SETTINGS.tdeeFactor;
  const run = plannedRun(date);
  let mult = 1, why = "Full deficit day.";
  if(isTaper(date)){ mult = 0; why = "Taper. Eating at maintenance until race day."; }
  else if(run.type === "race"){ mult = 0; why = "Race day. Fuel, don't restrict."; }
  else if(run.type === "long" && run.distance_km >= 15){ mult = 0; why = "Long run of 15 km or more. Maintenance, not a deficit."; }
  else if(run.type === "long"){ mult = 0.5; why = "Long run day. Half the usual deficit."; }
  else if(run.type === "quality" || run.type === "test"){ mult = 0.6; why = "Quality session. Deficit trimmed back."; }
  else if(run.type === "steady"){ mult = 0.8; why = "Steady work today. Slightly softer deficit."; }
  else if(run.type === "rest" && !plannedStrength(date)){ mult = 1.15; why = "Full rest. The cheapest day of the week to bank a deficit."; }
  const kcal = Math.round((tdee - SETTINGS.deficit*mult)/10)*10;
  const p = Math.round(w*SETTINGS.proteinPerKg);
  const f = Math.round(w*SETTINGS.fatPerKg);
  const c = Math.max(0, Math.round((kcal - p*4 - f*9)/4));
  return {kcal, protein:p, fat:f, carbs:c, why, maintenance:Math.round(tdee/10)*10};
}

/* ═══════════════════════════════════════════════════════════════
   THE DAY OBJECT — the single source of truth every screen reads.
   Stored logs hold only what you entered; buildDay() hydrates it
   with the prescription and every derived field.
   ═══════════════════════════════════════════════════════════════ */
const isWeekend = date => { const w = parseISO(date).getDay(); return w === 0 || w === 6; };
const cfaTargetFor = date => isWeekend(date) ? SETTINGS.cfaWeekend : SETTINGS.cfaWeekday;

function blank(){
  return {weight_kg:null, food:[], run:null, lift:null,
          hours:{growth:0, cfa:0, sleep:0}, runDone:false, liftDone:false};
}
function raw(date){
  if(!LOGS[date]) LOGS[date] = blank();
  const l = LOGS[date];
  if(!l.food) l.food = [];
  if(!l.hours) l.hours = {growth:0, cfa:0, sleep:0};
  return l;
}
function buildDay(date){
  const l = LOGS[date] || blank();
  const food = l.food || [];
  const t = calorieTarget(date);
  const sum = food.reduce((a,e)=>({
    kcal:a.kcal+e.kcal, p:a.p+e.protein, c:a.c+e.carbs, f:a.f+e.fat
  }), {kcal:0,p:0,c:0,f:0});

  const pRun = plannedRun(date);
  const pLift = plannedStrength(date);
  /* "completed" means nothing is owed: either it was done, or none was asked for. */
  const runDone = !!l.runDone || pRun.type === "rest";
  const liftDone = !!l.liftDone || !pLift;
  /* But a day with nothing scheduled doesn't close the training pillar for free —
     you still have to have moved. */
  const prescribed = pRun.type !== "rest" || !!pLift;

  const hrs = l.hours || {growth:0,cfa:0,sleep:0};
  const dayNo = daysBetween(SETTINGS.hardStart, date) + 1;
  const inHard = dayNo >= 1 && dayNo <= SETTINGS.hardLength;
  const workoutMet = prescribed ? (runDone && liftDone)
    : !!(l.runDone || l.liftDone || l.run || l.lift);
  const pillars = [
    {k:"growth",name:"Personal growth",  val:hrs.growth||0, target:SETTINGS.growthTarget, unit:"h"},
    {k:"train", name:"Workout and run",  val:workoutMet?1:0, target:1,                    unit:"done"},
    {k:"cfa",   name:"CFA Level II",     val:hrs.cfa||0,    target:cfaTargetFor(date),    unit:"h"},
    {k:"sleep", name:"Sleep",            val:hrs.sleep||0,  target:SETTINGS.sleepTarget,  unit:"h"}
  ];
  pillars.forEach(p=>p.met = p.val >= p.target);

  return {
    date,
    weight_kg: l.weight_kg,
    calories: {target:t.kcal, consumed:Math.round(sum.kcal),
      protein_g:Math.round(sum.p), carbs_g:Math.round(sum.c), fat_g:Math.round(sum.f),
      targets:t, entries:food},
    running: {planned:pRun, actual:l.run || null, completed:runDone},
    strength:{planned:pLift, actual:l.lift || null, completed:liftDone},
    hard75:  {day_number:dayNo, in_challenge:inHard, pillars,
      growth_hours:hrs.growth||0, cfa_hours:hrs.cfa||0, sleep_hours:hrs.sleep||0,
      workout_run_completed:workoutMet,
      all_pillars_met:pillars.every(p=>p.met)},
    week: weekFor(date),
    touched: !!(l.weight_kg || food.length || l.run || l.lift ||
               (hrs.growth||hrs.cfa||hrs.sleep) || l.runDone || l.liftDone)
  };
}

/* ---- history helpers ---------------------------------------- */
function datesUpTo(date, n){
  const out = [];
  for(let i=n-1;i>=0;i--) out.push(addDays(date,-i));
  return out;
}
function lastWeightOnOrBefore(date){
  for(let i=0;i<120;i++){
    const d = addDays(date,-i), l = LOGS[d];
    if(l && l.weight_kg != null) return l.weight_kg;
  }
  return null;
}
function rollingWeight(date, n){
  const vals = [];
  for(let i=0;i<n;i++){
    const l = LOGS[addDays(date,-i)];
    if(l && l.weight_kg != null) vals.push(l.weight_kg);
  }
  if(vals.length < 3) return null;
  return r1(vals.reduce((a,b)=>a+b,0)/vals.length);
}
/* Monday-anchored week key for the date. */
function weekStart(date){
  const d = parseISO(date);
  d.setDate(d.getDate() - ((d.getDay()+6)%7));
  return iso(d);
}
function weekBalance(mondayISO){
  let bal = 0, days = 0, km = 0;
  for(let i=0;i<7;i++){
    const dt = addDays(mondayISO,i);
    if(dt > todayISO()) break;
    const l = LOGS[dt];
    if(!l || !l.food || !l.food.length) continue;
    const day = buildDay(dt);
    bal += day.calories.consumed - day.calories.target;
    days++;
    if(l.run && l.run.distance_km) km += l.run.distance_km;
  }
  return {balance:Math.round(bal), days, km:r1(km)};
}
function weightPace(date){
  const now = rollingWeight(date,7) || lastWeightOnOrBefore(date);
  if(now == null) return null;
  const left = daysBetween(date, SETTINGS.targetWeightDate);
  const toGo = r1(now - SETTINGS.targetWeight);
  const total = daysBetween(SETTINGS.blockStart, SETTINGS.targetWeightDate);
  const gone = daysBetween(SETTINGS.blockStart, date);
  const shouldBe = r1(SETTINGS.startWeight -
    (SETTINGS.startWeight - SETTINGS.targetWeight) * Math.min(1, Math.max(0, gone/total)));
  const rateNeeded = left > 0 ? r1(toGo / (left/7)) : null;  // kg per week
  return {now, toGo, daysLeft:left, shouldBe, rateNeeded, ahead:r1(shouldBe - now)};
}

/* ── polarised split ───────────────────────────────────────────────────
   80% of kilometres easy, 20% at or above threshold. Steady counts half,
   because that is exactly the grey zone the rule is trying to keep small. */
function polarSplit(fromISO, toISO){
  let easy = 0, hard = 0;
  for(let dt = fromISO; dt <= toISO; dt = addDays(dt,1)){
    const l = LOGS[dt];
    if(!l || !l.run || !l.run.distance_km) continue;
    const km = l.run.distance_km;
    const w = HARD_KINDS[plannedRun(dt).type] || 0;
    hard += km*w; easy += km*(1-w);
  }
  const tot = easy+hard;
  return tot ? {easy:r1(easy), hard:r1(hard), pct:Math.round(easy/tot*100), km:r1(tot)} : null;
}

/* ═══════════════════════════════════════════════════════════════
   DIRECTIVE ENGINE
   Pure functions over (day, history helpers, settings). Each rule
   returns null or {id, tone, tag, text}. Add a rule to RULES and
   nothing else in the app has to change.
   tone: "calm" | "" (amber) | "warn" | "good"
   ═══════════════════════════════════════════════════════════════ */
const RULES = [

  function taper(d){
    if(!isTaper(d.date)) return null;
    const dl = daysBetween(d.date, SETTINGS.raceDate);
    if(dl < 0) return null;
    return {id:"taper", tone:"", tag:"Taper — "+dl+" days out",
      text:"Fat loss is off the table until the 14th. Eat at maintenance or a little above, put carbs in, "+
        "and treat sleep as the session that matters most. Volume drops; sharpness doesn't."};
  },

  function raceDay(d){
    if(d.running.planned.type !== "race") return null;
    return {id:"race", tone:"good", tag:"Race day",
      text:"21.1 km. Start slower than feels right and hold it to 15 km. Then decide what's left."};
  },

  function longRunToday(d){
    const r = d.running.planned;
    if(r.type !== "long") return null;
    const carbs = d.calories.targets.carbs;
    const fuel = r.distance_km >= 12
      ? " Past 75 minutes you need 30–60 g of carbs an hour — use the exact product you'll race with."
      : " Under 75 minutes, water is enough.";
    return {id:"long-today", tone:"", tag:"Long run",
      text:r.title+" at "+paceTextFor("long")+". "+d.calories.target+" kcal and "+carbs+
        " g of carbs today — maintenance, not a deficit, whatever the week's balance says."+fuel};
  },

  function heat(d){
    const a = adjustedPace(d.running.planned.type);
    if(!a || d.running.planned.type === "rest") return null;
    if(a.band.pen < 12) return null;
    return {id:"heat", tone:a.band.pen >= 50 ? "warn" : "calm", tag:"Dew "+r1(a.dew)+"°",
      text:a.band.label+" conditions. "+a.band.advice+" Prescribed band is "+fmtBand(a.raw)+
        ", which today is really "+fmtBand(a.adj)+". Run the effort, not the number."};
  },

  function acclimatise(d){
    const gone = daysBetween(SETTINGS.blockStart, d.date);
    if(gone < 0 || gone > 13) return null;
    const stage = gone < 4
      ? "Easy 30–45 minutes only. Your heart rate will read high and your pace will read slow. Both are expected — do not chase either."
      : gone < 10
      ? "Extend to 45–60 minutes, still easy to moderate. No quality work inside the heat yet."
      : "You can start putting quality back inside the heat. Most of the adaptation is done by day 14.";
    return {id:"acclim", tone:"calm", tag:"Day "+(gone+1)+" of heat",
      text:stage};
  },

  function polarised(d){
    const from = addDays(d.date,-27);
    const sp = polarSplit(from, d.date);
    if(!sp || sp.km < 40) return null;
    if(sp.pct >= 76 && sp.pct <= 88) return null;
    return sp.pct < 76
      ? {id:"polar", tone:"warn", tag:"Too much grey",
         text:"Only "+sp.pct+"% of the last four weeks was easy, against a target of 80%. The easy runs are the ones being run too hard — that is what caps the hard sessions."}
      : {id:"polar", tone:"calm", tag:"All easy",
         text:sp.pct+"% of the last four weeks was easy. Comfortable, but the 20% that is meant to be genuinely hard isn't happening. Threshold work is the highest-return thing in the block."};
  },

  function longRunTomorrow(d){
    const t = plannedRun(addDays(d.date,1));
    if(!(t.type === "long" && t.distance_km >= 15)) return null;
    if(d.running.planned.type === "long") return null;
    return {id:"carb-load", tone:"", tag:"Carb load",
      text:t.distance_km+" km tomorrow. Eat at or slightly above maintenance today ("+
        d.calories.targets.maintenance+" kcal) and load the carbs into dinner. A deficit tonight "+
        "gets paid for at kilometre 14."};
  },

  function restDayDeficit(d){
    if(d.running.planned.type !== "rest" || d.strength.planned) return null;
    const wk = weekBalance(weekStart(d.date));
    if(wk.balance < -400) return null;
    return {id:"rest-bank", tone:"calm", tag:"Rest day",
      text:"Nothing scheduled and nothing to fuel. The week is running at "+
        (wk.balance >= 0 ? "+" : "")+wk.balance+" kcal so far — this is the cheapest day on the "+
        "calendar to bank a deficit."};
  },

  function surplusStreak(d){
    if(isTaper(d.date)) return null;
    const w0 = weekStart(d.date);
    const a = weekBalance(addDays(w0,-7)), b = weekBalance(addDays(w0,-14));
    if(a.days < 4 || b.days < 4) return null;
    if(a.balance <= 0 || b.balance <= 0) return null;
    return {id:"surplus-2w", tone:"warn", tag:"Two weeks in surplus",
      text:"The last two full weeks came in at +"+a.balance+" and +"+b.balance+
        " kcal against target. The target is fat loss. That gap is the whole reason the scale "+
        "isn't moving — it isn't the training."};
  },

  function flatWeight(d){
    if(isTaper(d.date)) return null;
    const now = rollingWeight(d.date,7), then = rollingWeight(addDays(d.date,-10),7);
    if(now == null || then == null) return null;
    if(now < then - 0.15) return null;
    return {id:"weight-flat", tone:"warn", tag:"Trend has stalled",
      text:"The 7-day average is "+now+" kg against "+then+" kg ten days ago. Worth a look at the "+
        "logging before the targets — most stalls are unlogged food, not a broken metabolism."};
  },

  function behindPace(d){
    if(isTaper(d.date)) return null;
    const p = weightPace(d.date);
    if(!p || p.daysLeft <= 0) return null;
    if(p.ahead >= -0.4) return null;
    return {id:"behind-pace", tone:"warn", tag:"Behind the line",
      text:p.now+" kg against a straight-line path of "+p.shouldBe+" kg for today. "+p.daysLeft+
        " days to "+shortDate(SETTINGS.targetWeightDate)+" and "+p.toGo+" kg to go — that is "+
        p.rateNeeded+" kg a week from here."};
  },

  function pillarRisk(d){
    if(!d.hard75.in_challenge) return null;
    if(d.date !== todayISO()) return null;
    if(new Date().getHours() < SETTINGS.eveningHour) return null;
    const open = d.hard75.pillars.filter(p=>p.val === 0);
    if(!open.length) return null;
    const rank = missRanking();
    open.sort((a,b)=>(rank[b.k]||0)-(rank[a.k]||0));
    const SHORT = {growth:"personal growth", train:"training", cfa:"CFA study", sleep:"sleep"};
    const lead = open[0];
    return {id:"pillar-risk", tone:"warn", tag:"Day "+d.hard75.day_number,
      text:"Nothing logged against "+listify(open.map(p=>SHORT[p.k]))+". "+
        (rank[lead.k] ? SHORT[lead.k].replace(/^the /,"")[0].toUpperCase()+SHORT[lead.k].replace(/^the /,"").slice(1)+
          " is the one you miss most — start there." : "Start with whichever is shortest.")};
  },

  function missedYesterday(d){
    if(d.date !== todayISO()) return null;
    const y = addDays(d.date,-1), ly = LOGS[y];
    if(!ly) return null;
    if(ly.missAck) return null;
    const yd = buildDay(y);
    const missRun = yd.running.planned.type !== "rest" && !yd.running.completed;
    const missLift = !!yd.strength.planned && !yd.strength.completed;
    if(!missRun && !missLift) return null;
    if(!yd.touched) return null;
    const what = missRun && missLift ? "yesterday's run and lift"
      : missRun ? "yesterday's "+yd.running.planned.title.toLowerCase()
      : "yesterday's "+yd.strength.planned.name.toLowerCase();
    return {id:"missed", tone:"calm", tag:"Yesterday", ack:y,
      text:what.charAt(0).toUpperCase()+what.slice(1)+" went unlogged. Don't stack it onto today — "+
        "a missed session inside a 23-week block costs nothing. Mark it or move on; this won't come back."};
  },

  function proteinShort(d){
    if(d.calories.consumed < d.calories.target*0.6) return null;
    const t = d.calories.targets.protein, got = d.calories.protein_g;
    if(got >= t*0.8) return null;
    return {id:"protein", tone:"calm", tag:"Protein",
      text:got+" g logged against "+t+" g. In a deficit and training six days a week, protein is what "+
        "decides whether the weight you lose comes off the right place."};
  },

  function plainDay(d){
    const r = d.running.planned, s = d.strength.planned;
    const bits = [];
    if(r.type !== "rest") bits.push(r.title+" at "+paceTextFor(r.type));
    if(s) bits.push(s.name.replace(" · "," ")+(s.light ? ", light" : ""));
    const body = bits.length ? bits.join(", then ")+". " : "Nothing on the plan. ";
    return {id:"plain", tone:"calm", tag:bits.length ? "On the plan" : "Clear day",
      text:body+d.calories.target+" kcal and "+d.calories.targets.protein+
        " g protein. "+d.calories.targets.why};
  }
];

function paceTextFor(kind){
  const a = adjustedPace(kind);
  if(!a) return "your own effort";
  return fmtBand(a.adj)+" /km";
}
function listify(a){
  if(a.length === 1) return a[0];
  if(a.length === 2) return a[0]+" and "+a[1];
  return a.slice(0,-1).join(", ")+" and "+a[a.length-1];
}

/* Which pillar gets missed most, computed once history exists. */
function missRanking(){
  const count = {growth:0, train:0, cfa:0, sleep:0};
  let n = 0;
  const start = SETTINGS.hardStart, end = todayISO();
  for(let dt = start; dt < end && n < 120; dt = addDays(dt,1)){
    const l = LOGS[dt];
    if(!l) continue;
    const day = buildDay(dt);
    if(!day.touched) continue;
    n++;
    day.hard75.pillars.forEach(p=>{ if(!p.met) count[p.k]++; });
  }
  return n >= 5 ? count : {};
}

/* Which rules are allowed to be the headline. The lead answers "what does
   today require"; everything else drops underneath it as a note. */
const LEAD_IDS = ["race","taper","long-today","carb-load","rest-bank","plain"];

function evaluateDirectives(day){
  const out = [];
  for(const rule of RULES){
    let r = null;
    try{ r = rule(day); }catch(e){ r = null; }
    if(r) out.push(r);
  }
  const lead = out.find(x=>LEAD_IDS.includes(x.id)) || out[0];
  const notes = out.filter(x=>x !== lead && x.id !== "plain").slice(0,3);
  return lead ? [lead].concat(notes) : notes;
}

function sh(title, right){
  return '<div class="sh"><h2>'+esc(title)+'</h2><span class="rule"></span>'+
    (right ? '<span class="r">'+esc(right)+'</span>' : "")+'</div>';

function countTo(el, to){
  if(!el) return;
  const t0 = performance.now(), dur = 560, from = 0;
  (function step(now){
    const k = Math.min(1,(now-t0)/dur), e = 1-Math.pow(1-k,3);
    el.textContent = Math.round(from+(to-from)*e);
    if(k < 1) requestAnimationFrame(step);
  })(performance.now());
}

let charts = {};
const killCharts = ()=>{ Object.values(charts).forEach(c=>{try{c.destroy();}catch(e){}}); charts = {}; };

function loggedDates(){
  return Object.keys(LOGS).filter(d=>{
    const l = LOGS[d];
    return l && (l.weight_kg != null || (l.food&&l.food.length) || l.run || l.lift ||
      (l.hours && (l.hours.job||l.hours.cfa||l.hours.sleep)) || l.runDone || l.liftDone);
  }).sort();
}
function weekKm(){ const m = weekStart(todayISO()); let k = 0;
  for(let i=0;i<7;i++){ const l = LOGS[addDays(m,i)]; if(l&&l.run&&l.run.distance_km) k += l.run.distance_km; }
  return k; }
function totalKm(){ return loggedDates().reduce((a,d)=>{
  const l = LOGS[d]; return a + (l.run&&l.run.distance_km ? l.run.distance_km : 0); },0); }
function hardStats(){
  const st = SETTINGS.hardStart, N = SETTINGS.hardLength, t = todayISO();
  let best = 0, run = 0, perfect = 0;
  for(let i=0;i<N;i++){
    const dt = addDays(st,i); if(dt > t) break;
    if(buildDay(dt).hard75.all_pillars_met){ run++; perfect++; best = Math.max(best,run); } else run = 0;
  }
  const done = Math.max(0, Math.min(N, daysBetween(st,t)+1));
  return {current:run, best, perfect, left:Math.max(0,N-done)};
}

  killCharts();
  const dates = loggedDates(), t = todayISO();

  let h = '<div class="hero"><div class="metarow"><span class="tag">Trend</span>'+DOT+

    '<h1>Are you on track</h1></div>';

    kpi(avg != null ? avg : "—","7-day avg kg",
      avg != null && p ? (p.ahead >= 0 ? "+"+p.ahead+" ahead of line" : r1(-p.ahead)+" behind line") : "needs 3 mornings",
      avg != null && p ? (p.ahead >= 0 ? "g" : "r") : "")+
    kpi(st.current,"streak","best "+st.best+" · "+st.left+" left", st.current?"a":"")+
    kpi(r1(weekKm()),"km this week","logged total "+r1(totalKm()),"")+
    kpi(daysBetween(t,SETTINGS.raceDate),"days to race",shortDate(SETTINGS.raceDate)+" · 21.1 km","a")+'</div>';

        '<span style="margin-left:auto">'+sp.km+' km</span></div>'+
        '<p class="xs d3" style="margin-top:11px;line-height:1.6">'+
          (sp.pct >= 76 && sp.pct <= 88
            ? "Sitting where it should. Roughly 80% easy is what the evidence supports, even for a half."
            : sp.pct < 76
            ? "Too much of this is hard. The fix is slowing the easy runs down, not cutting the workouts."

      : '<div class="empty"><b>Building your split</b><span>Log a few runs with distance and this fills in.</span></div>')+
    '</div>';

  const ws = weightSeries(), fu = fuelSeries(), ps = paceSeries();
  h += sh("Weight")+'<div class="card pad">'+
    '<p class="xs d3" style="line-height:1.55">7-day rolling average against the straight line to '+
      SETTINGS.targetWeight+' kg by '+shortDate(SETTINGS.targetWeightDate)+'. Raw mornings sit faintly behind it.</p>'+
    cbox("cWeight", ws.labels.length >= 3, "Three logged mornings and the average draws.")+'</div>';

  h += sh("Fuel against load")+'<div class="card pad">'+
    '<p class="xs d3" style="line-height:1.55">Weekly calorie balance versus kilometres run. Bars below zero are a deficit.</p>'+
    cbox("cFuel", fu.labels.length >= 2, "Two weeks of food logs and this fills in.")+'</div>';

  h += sh("Distance")+'<div class="card pad">'+
    '<p class="xs d3" style="line-height:1.55">Weekly volume, planned against actual, across the block.</p>'+
    cbox("cRun", true, "")+'</div>';

  h += sh("Pace")+'<div class="card pad">'+
    '<p class="xs d3" style="line-height:1.55">Average pace per logged run. Lower is faster — but read it against the dew point, not in isolation.</p>'+
    cbox("cPace", ps.data.length >= 2, "Log two runs with a distance and a duration.")+'</div>';

  h += sh("75 Hard", buildDay(t).hard75.day_number+" / "+SETTINGS.hardLength)+'<div class="card pad">'+
    '<p class="xs d3" style="line-height:1.55">One square a day. Shading is how many of the four pillars closed.</p>'+
    '<div class="sgrid" id="sgrid"></div>'+
    '<div class="mkey" style="margin-top:11px">Less <i class="sq" style="background:var(--sunk)"></i>'+
      '<i class="sq p1"></i><i class="sq p2"></i><i class="sq p3"></i><i class="sq p4"></i> More'+
      '<span style="margin-left:auto">'+st.perfect+' perfect</span></div></div>';

  $("#v-progress").innerHTML = h;
  streakGrid();
  requestAnimationFrame(()=>$$(".meter i").forEach(i=>i.style.width = i.dataset.w+"%"));
  drawWeight(); drawFuel(); drawRun(); drawPace();
}
const kpi = (v,l,s,c)=>'<div><b class="'+(c||"")+'">'+esc(v)+'</b><span>'+esc(l)+'</span><em>'+esc(s)+'</em></div>';
const cbox = (id,ok,msg)=> ok ? '<div class="cbox"><canvas id="'+id+'"></canvas></div>'
  : '<div class="empty"><b>Building your trend</b><span>'+esc(msg)+'</span></div>';

function streakGrid(){
  const g = $("#sgrid"); if(!g) return;
  const t = todayISO(); let h = "";
  for(let i=0;i<SETTINGS.hardLength;i++){
    const dt = addDays(SETTINGS.hardStart,i);
    if(dt > t){ h += '<div class="sq future"></div>'; continue; }
    const n = buildDay(dt).hard75.pillars.filter(p=>p.met).length;
    h += '<button class="sq'+(n?" p"+n:"")+(dt===t?" today":"")+'" data-jump="'+dt+'" title="'+shortDate(dt)+' · '+n+'/4"></button>';
  }
  g.innerHTML = h;
  g.querySelectorAll("[data-jump]").forEach(b=>b.onclick = ()=>{ cursor = b.dataset.jump; go("today"); });
}

/* ---- series ---- */
function weightSeries(){
  const ds = loggedDates().filter(d=>LOGS[d].weight_kg != null);
  if(!ds.length) return {labels:[],raw:[],avg:[],line:[]};
  const first = ds[0], last = todayISO();
  const labels=[],rw=[],av=[],ln=[];
  const total = daysBetween(SETTINGS.blockStart, SETTINGS.targetWeightDate) || 1;
  for(let dt=first; dt<=last; dt=addDays(dt,1)){
    labels.push(shortDate(dt));
    rw.push(LOGS[dt] && LOGS[dt].weight_kg != null ? LOGS[dt].weight_kg : null);
    av.push(rollingWeight(dt,7));
    const k = Math.min(1,Math.max(0, daysBetween(SETTINGS.blockStart,dt)/total));
    ln.push(r1(SETTINGS.startWeight - (SETTINGS.startWeight-SETTINGS.targetWeight)*k));
  }
  return {labels,raw:rw,avg:av,line:ln};
}
function fuelSeries(){
  const ds = loggedDates(); if(!ds.length) return {labels:[],bal:[],km:[]};
  const labels=[],bal=[],km=[]; const end = weekStart(todayISO());
  for(let w = weekStart(ds[0]); w <= end; w = addDays(w,7)){
    const b = weekBalance(w); if(!b.days) continue;
    labels.push(shortDate(w)); bal.push(b.balance); km.push(b.km);
  }
  return {labels,bal,km};
}
function runSeries(){
  const labels=[],pl=[],ac=[];
  PLAN.weeks.forEach(w=>{
    labels.push("W"+w.w); pl.push(w.km);
    let a=0,any=false;
    for(let i=0;i<7;i++){ const l = LOGS[addDays(w.start,i)];
      if(l&&l.run&&l.run.distance_km){ a += l.run.distance_km; any = true; } }
    ac.push(any ? r1(a) : null);
  });
  return {labels,planned:pl,actual:ac};
}
function paceSeries(){
  const labels=[],data=[];
  loggedDates().forEach(d=>{ const r = LOGS[d].run;
    if(r && r.distance_km > 0 && r.duration_min > 0){ labels.push(shortDate(d)); data.push(r1(r.duration_min/r.distance_km)); } });
  return {labels,data};
}

const VIEWS = ["today","log","progress","plan"];
function go(v){
  view = v;
  $$(".view").forEach(s=>s.classList.toggle("on", s.id === "v-"+v));
  $$("nav button").forEach(b=>b.setAttribute("aria-selected", String(b.dataset.v === v)));
  const g = $("#glide");
  if(g) g.style.transform = "translateX("+(VIEWS.indexOf(v)*100)+"%)";
  render(); window.scrollTo(0,0);
}
function render(){
  renderChrome();
  ({today:renderToday, log:renderLog, progress:renderProgress, plan:renderPlan}[view] || renderToday)();
}
$$("nav button").forEach(b=>b.onclick = ()=>{ buzz(6); go(b.dataset.v); });

  document.documentElement.dataset.theme = n;
  document.querySelector('meta[name="theme-color"]').setAttribute("content", n === "dark" ? "#08090C" : "#EFEDE6");
  SETTINGS.theme = n; saveSettings();

/* Horizontal swipe on Today steps the date; elsewhere it steps the tab. */
(function swipe(){
  let x0 = null, y0 = null, t0 = 0;
  const el = document.getElementById("app");
  el.addEventListener("touchstart", e=>{
    if(e.touches.length !== 1) return;
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; t0 = Date.now();
  }, {passive:true});
  el.addEventListener("touchend", e=>{
    if(x0 == null) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - x0, dy = t.clientY - y0;
    x0 = null;
    if(Date.now()-t0 > 600) return;
    if(Math.abs(dx) < 60 || Math.abs(dy) > Math.abs(dx)*0.7) return;
    if(e.target.closest(".seg, .res, .quick, .pin, .sheet, input, textarea, select")) return;
    if(view === "today"){
      if(dx < 0){ if(cursor < todayISO()){ cursor = addDays(cursor,1); buzz(6); renderToday(); } }
      else { cursor = addDays(cursor,-1); buzz(6); renderToday(); }
    }else{
      const i = VIEWS.indexOf(view), n = i + (dx < 0 ? 1 : -1);
      if(n >= 0 && n < VIEWS.length){ buzz(6); go(VIEWS[n]); }
    }
  }, {passive:true});
})();

const HOUR_PILLARS = {growth:1, cfa:1, sleep:1};
let dirTimer = null;

function wireToday(){
  $("#dPrev").onclick = ()=>{ cursor = addDays(cursor,-1); renderToday(); };
  $("#dNext").onclick = ()=>{ if(cursor < todayISO()){ cursor = addDays(cursor,1); renderToday(); } };

  const view_ = $("#v-today");
  view_.querySelectorAll("[data-done]").forEach(b=>b.onclick = e=>{
    e.stopPropagation();
    const k = b.dataset.done, l = raw(cursor);
    if(k === "run") l.runDone = !l.runDone; else l.liftDone = !l.liftDone;
    saveLogs(); buzz(12); popNext = k;
    toast((k === "run" ? "Run " : "Session ") + ((k==="run"?l.runDone:l.liftDone) ? "done" : "un-marked"));
    renderToday();
  });
  const rb = view_.querySelector('[data-open="run"]');
  if(rb) rb.onclick = ()=>{ logTab = "run"; go("log"); };
  const eb = view_.querySelector("[data-exp]");
  if(eb) eb.onclick = ()=>{
    liftOpen = !liftOpen;
    $("#liftExp").classList.toggle("open", liftOpen);
    $("#liftRow").classList.toggle("isopen", liftOpen);
  };
  view_.querySelectorAll("[data-openlog]").forEach(b=>b.onclick = ()=>{ logTab = b.dataset.openlog; go("log"); });

  /* per-exercise ticks, stored straight into the session */
  view_.querySelectorAll("[data-ex]").forEach(b=>b.onclick = ()=>{
    const name = b.dataset.ex, l = raw(cursor);
    l.lift = l.lift || {exercises:[]};
    let rec = l.lift.exercises.find(x=>x.name === name);
    if(!rec){ rec = {name, sets:null, reps:null, weight_kg:null, completed:false}; l.lift.exercises.push(rec); }
    rec.completed = !rec.completed;
    b.classList.toggle("on", rec.completed);
    const pres = liftExercises(buildDay(cursor).strength.planned);
    if(pres.length && pres.every(e=>l.lift.exercises.some(x=>x.name===e.n && x.completed))) l.liftDone = true;
    saveLogs(); buzz(8);
  });

  /* Hour pillars: tap the value to open presets, tap a preset to set it.
     Everything updates in place so the row you tapped doesn't get destroyed. */
  const pl = $("#pillars");
  if(pl) pl.addEventListener("click", e=>{
    const open = e.target.closest(".hval");
    if(open){
      const k = open.dataset.p, panel = $("#pre-"+k);
      const wasOpen = panel.classList.contains("open");
      $$("#pillars .presets").forEach(x=>x.classList.remove("open"));
      $$("#pillars .pill").forEach(x=>x.classList.remove("open"));
      if(!wasOpen){ panel.classList.add("open"); $("#pill-"+k).classList.add("open"); buzz(6); }
      return;
    }
    const set = e.target.closest("[data-set]");
    if(!set) return;
    const k = set.dataset.p, after = parseFloat(set.dataset.set);
    if(!HOUR_PILLARS[k]) return;
    const l = raw(cursor), before = l.hours[k] || 0;
    const day0 = buildDay(cursor);
    const target = (day0.hard75.pillars.find(p=>p.k === k) || {}).target || 0;
    l.hours[k] = after; saveLogs(); buzz(10);

    const pill = $("#pill-"+k);
    pill.querySelector(".hval b").textContent = r1(after);
    pill.querySelector(".pd").textContent = r1(after)+" of "+target+" hours";
    pill.querySelector(".prg").style.width = Math.min(100, target ? after/target*100 : 0)+"%";
    const met = after >= target;
    pill.classList.toggle("done", met);
    $$("#pre-"+k+" [data-set]").forEach(b=>b.classList.toggle("on",
      parseFloat(b.dataset.set) === after && after > 0));
    $("#pre-"+k).classList.remove("open"); pill.classList.remove("open");

    const day = buildDay(cursor);
    $$("#v-today .sh .r").forEach(el=>{
      if(/of 4$/.test(el.textContent))
        el.textContent = day.hard75.pillars.filter(p=>p.met).length+" of 4";
    });
    if(met && before < target){
      const tk = pill.querySelector(".tick");
      tk.classList.add("pop"); setTimeout(()=>tk.classList.remove("pop"), 480);
      buzz(18);
      toast(day.hard75.all_pillars_met ? "All four pillars closed" : "Pillar closed");
    }
    clearTimeout(dirTimer); dirTimer = setTimeout(renderDirectives, 600);
  });
}

function wireFood(){
  const q = $("#fq"), res = $("#fres"), g = $("#fg"), prev = $("#fprev");
  function list(){
    const term = q.value.trim().toLowerCase();
    const items = (term ? allFoods().filter(f=>f.n.toLowerCase().includes(term)) : allFoods()).slice(0,9);
    res.innerHTML = items.map(f=>'<button class="fr2'+(pickedFood&&pickedFood.id===f.id?" sel":"")+'" data-f="'+f.id+'">'+
      '<div><div class="a">'+esc(f.n)+'</div><div class="b">'+f.p+'p · '+f.c+'c · '+f.f+'f</div></div>'+
      '<span class="k">'+f.kcal+'</span></button>').join("");
    res.querySelectorAll("[data-f]").forEach(b=>b.onclick = ()=>{
      pickedFood = allFoods().find(f=>f.id === b.dataset.f); list(); pre(); g.focus(); });
  }
  function pre(){
    const gr = parseFloat(g.value);
    if(!pickedFood){ prev.textContent = "Pick a food first."; return; }
    if(!gr){ prev.textContent = pickedFood.n+" selected. Enter grams."; return; }
    const k = gr/100;
    prev.innerHTML = '<span class="amb">'+r0(pickedFood.kcal*k)+' kcal</span> · '+r1(pickedFood.p*k)+
      ' p · '+r1(pickedFood.c*k)+' c · '+r1(pickedFood.f*k)+' f';
  }
  q.oninput = list; g.oninput = pre; list(); pre();

  const qk = $("#quick");
  if(qk) qk.querySelectorAll("[data-q]").forEach(b=>b.onclick = ()=>{
    const f = allFoods().find(x=>x.n === b.dataset.q);
    if(!f) return toast("That food is no longer in your list");
    pickedFood = f; q.value = ""; g.value = b.dataset.g; list(); pre(); buzz(6);
  });

  $("#fadd").onclick = ()=>{
    const gr = parseFloat(g.value);
    if(!pickedFood) return toast("Pick a food first");
    if(!gr || gr <= 0) return toast("Enter grams");
    const k = gr/100;
    raw(cursor).food.push({food:pickedFood.n, grams:gr, kcal:pickedFood.kcal*k,
      protein:pickedFood.p*k, carbs:pickedFood.c*k, fat:pickedFood.f*k,
      time:new Date().toTimeString().slice(0,5)});
    saveLogs(); buzz(10); toast(r0(pickedFood.kcal*k)+" kcal added");
    g.value = ""; renderLog();
  };
  $("#flist").addEventListener("click", e=>{
    const b = e.target.closest("[data-del]"); if(!b) return;
    b.closest(".ent").classList.add("rm");
    setTimeout(()=>{ raw(cursor).food.splice(+b.dataset.del,1); saveLogs(); renderLog(); }, 230);
  });
  $("#nfsave").onclick = ()=>{
    const n = $("#nfn").value.trim(), kcal = parseFloat($("#nfk").value);
    if(!n || !isFinite(kcal)) return toast("Name and kcal are required");
    CUSTOM_FOODS.push({id:"c"+Date.now(), n, kcal, p:parseFloat($("#nfp").value)||0,
      c:parseFloat($("#nfc").value)||0, f:parseFloat($("#nff").value)||0});
    saveFoods(); toast(n+" saved"); renderLog();
  };
}

function wireRun(){
  const km = $("#rkm"), min = $("#rmin");
  const upd = ()=>{ const k = parseFloat(km.value), m = parseFloat(min.value);
    $("#rpace").innerHTML = (k>0 && m>0) ? '<span class="amb">'+paceStr(m/k)+' /km</span> average'
      : "Distance and duration give you the pace."; };
  km.oninput = upd; min.oninput = upd; upd();
  $("#rsave").onclick = ()=>{
    const k = parseFloat(km.value), m = parseFloat(min.value);
    if(!k || k <= 0) return toast("Distance is required");
    const l = raw(cursor);
    l.run = {distance_km:k, duration_min:m||null, avg_pace:(k&&m)?r1(m/k):null,
      avg_hr:parseFloat($("#rhr").value)||null, feel:$("#rfeel").value, notes:$("#rnote").value.trim()};
    l.runDone = true; saveLogs(); buzz(12);
    toast("Run saved · "+(m ? paceStr(m/k)+" /km" : k+" km")); renderLog();
  };
  if($("#rclear")) $("#rclear").onclick = ()=>{
    const l = raw(cursor); l.run = null; l.runDone = false; saveLogs(); toast("Cleared"); renderLog(); };
}

function wireLift(){
  $$("#logBody [data-tick]").forEach(b=>b.onclick = ()=>{ b.classList.toggle("on"); buzz(6); });
  if($("#lsave")) $("#lsave").onclick = ()=>{
    const ex = $$("#logBody .lrow").map(r=>({
      name:r.dataset.ex,
      sets:parseFloat(r.querySelector(".i-s").value)||null,
      reps:parseFloat(r.querySelector(".i-r").value)||null,
      weight_kg:parseFloat(r.querySelector(".i-w").value)||null,
      completed:r.querySelector("[data-tick]").classList.contains("on")
    })).filter(x=>x.sets||x.reps||x.weight_kg||x.completed);
    const l = raw(cursor); l.lift = {exercises:ex};
    if(ex.length && ex.every(x=>x.completed)) l.liftDone = true;
    saveLogs(); toast(ex.length+" exercises saved"); renderLog();
  };
  if($("#ldone")) $("#ldone").onclick = ()=>{
    const l = raw(cursor); l.liftDone = !l.liftDone; saveLogs(); buzz(12);
    toast(l.liftDone ? "Session complete" : "Marked not done"); renderLog(); };
  if($("#exadd")) $("#exadd").onclick = ()=>{
    const n = $("#exq").value.trim(); if(!n) return toast("Name the exercise");
    const l = raw(cursor); l.lift = l.lift || {exercises:[]};
    if(l.lift.exercises.some(x=>x.name === n)) return toast("Already on today's list");
    l.lift.exercises.push({name:n, sets:null, reps:null, weight_kg:null, completed:false});
    saveLogs(); renderLog();
  };
}
function wireBody(){
  $("#wsave").onclick = ()=>{

function wireSettings(){
  $("#shClose").onclick = closeSettings;
  $$("#sheetBody .acch").forEach(b=>b.onclick = ()=>b.parentElement.classList.toggle("open"));
  $("#setSave").onclick = ()=>{
    const n = (id,f)=>{ const v = parseFloat($(id).value); return isFinite(v) ? v : f; };
    SETTINGS.raceDate = $("#sRace").value || SETTINGS.raceDate;
    SETTINGS.blockStart = $("#sBlock").value || SETTINGS.blockStart;
    SETTINGS.hardStart = $("#sHard").value || SETTINGS.hardStart;
    SETTINGS.hardLength = Math.max(1, n("#sHardLen", SETTINGS.hardLength));
    SETTINGS.startWeight = n("#sStartW", SETTINGS.startWeight);
    SETTINGS.targetWeight = n("#sTargetW", SETTINGS.targetWeight);
    SETTINGS.targetWeightDate = $("#sTargetD").value || SETTINGS.targetWeightDate;
    SETTINGS.tdeeFactor = n("#sTdee", SETTINGS.tdeeFactor);
    SETTINGS.deficit = n("#sDef", SETTINGS.deficit);
    SETTINGS.proteinPerKg = n("#sPro", SETTINGS.proteinPerKg);
    SETTINGS.fatPerKg = n("#sFat", SETTINGS.fatPerKg);
    SETTINGS.growthTarget = n("#sGrowth", SETTINGS.growthTarget);
    SETTINGS.cfaWeekday = n("#sCfaWd", SETTINGS.cfaWeekday);
    SETTINGS.cfaWeekend = n("#sCfaWe", SETTINGS.cfaWeekend);
    SETTINGS.sleepTarget = n("#sSleep", SETTINGS.sleepTarget);
    SETTINGS.eveningHour = Math.min(23, Math.max(0, n("#sEve", SETTINGS.eveningHour)));
    SETTINGS.autoWeather = $("#sAuto").value === "1";
    SETTINGS.manualDew = n("#sDew", SETTINGS.manualDew);
    saveSettings(); toast("Saved"); closeSettings(); render();
    if(SETTINGS.autoWeather && !WEATHER) loadWeather();
  };
  $("#expBtn").onclick = ()=>{
    const blob = new Blob([JSON.stringify({app:"block", v:2, exported:new Date().toISOString(),
      logs:LOGS, settings:SETTINGS, customFoods:CUSTOM_FOODS}, null, 2)], {type:"application/json"});
    const url = URL.createObjectURL(blob), a = document.createElement("a");
    a.href = url; a.download = "block-"+todayISO()+".json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 1500); toast("Backup downloaded");
  };
  $("#impBtn").onclick = ()=>{
    const i = document.createElement("input"); i.type = "file"; i.accept = "application/json,.json";
    i.onchange = ()=>{
      const f = i.files && i.files[0]; if(!f) return;
      const r = new FileReader();
      r.onload = ()=>{ try{
        const j = JSON.parse(r.result);
        if(!j.logs || typeof j.logs !== "object") throw 0;
        LOGS = Object.assign({}, LOGS, j.logs);
        if(j.settings) SETTINGS = Object.assign({}, SETTINGS, j.settings);
        if(Array.isArray(j.customFoods)) CUSTOM_FOODS = j.customFoods;
        storage.set(K.logs, LOGS); saveSettings(); saveFoods();
        toast("Backup restored"); closeSettings(); render();
      }catch(e){ toast("That isn't a Block backup"); } };
      r.readAsText(f);
    };
    i.click();
  };
  $("#wipeBtn").onclick = ()=>{
    if(!confirm("Erase every logged day, setting and custom food? This cannot be undone.")) return;
    LOGS = {}; CUSTOM_FOODS = []; SETTINGS = Object.assign({}, DEFAULT_SETTINGS);
    storage.set(K.logs, LOGS); saveSettings(); saveFoods();
    cursor = todayISO(); toast("Erased"); closeSettings(); render();
  };
}

loadAll();
if(SETTINGS.theme){
  document.documentElement.dataset.theme = SETTINGS.theme;
  document.querySelector('meta[name="theme-color"]')
    .setAttribute("content", SETTINGS.theme === "dark" ? "#08090C" : "#EFEDE6");
}
cursor = todayISO();
go("today");
loadWeather();
if(!STORAGE_OK) toast("This browser is blocking storage — nothing will save");

document.addEventListener("visibilitychange", ()=>{
  if(document.visibilityState !== "visible") return;
  if(view === "today" && daysBetween(cursor, todayISO()) === 1){ cursor = todayISO(); render(); }
  if(WEATHER && Date.now() - WEATHER.at > 2*3600*1000) loadWeather();
});
</script>
</body>
</html>
