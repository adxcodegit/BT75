   ═══════════════════════════════════════════════════════════════ */
const VIEWS = ["today","log","progress","plan"];
function go(v){
  view = v;
  $$(".view").forEach(s=>s.classList.toggle("on", s.id === "v-"+v));
  $$("nav button").forEach(b=>b.setAttribute("aria-selected", String(b.dataset.v === v)));
  const g = $("#glide");
  if(g) g.style.transform = "translateX("+(VIEWS.indexOf(v)*100)+"%)";
  render(); window.scrollTo(0,0);
}
function render(){
  renderChrome(); renderGlobalWarn();
  ({today:renderToday, log:renderLog, progress:renderProgress, plan:renderPlan}[view] || renderToday)();
}
$$("nav button").forEach(b=>b.onclick = ()=>{ buzz(6); go(b.dataset.v); });
$("#themeBtn").onclick = ()=>{
  const n = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = n;
  document.querySelector('meta[name="theme-color"]').setAttribute("content", n === "dark" ? "#0B0B0C" : "#E9E3D6");
  SETTINGS.theme = n; saveSettings();
  if(view === "progress") renderProgress();
};
$("#setBtn").onclick = openSettings;
$("#scrim").onclick = closeSettings;
$("#dayChip").onclick = ()=>{ planTab = "hard"; go("plan"); };

/* Dates move by the arrows, the date chip or the keyboard — never by a swipe.
   A sideways drag on a phone is too easily a scroll, and losing your place
   mid-log is worse than one extra tap. Views move by the nav bar only. */
document.addEventListener("keydown", e=>{
  if(view !== "today") return;
  if(e.metaKey || e.ctrlKey || e.altKey) return;
  if(e.target.closest("input, textarea, select")) return;
  if(e.key === "ArrowLeft"){ cursor = addDays(cursor,-1); renderToday(); }
  else if(e.key === "ArrowRight" && cursor < todayISO()){ cursor = addDays(cursor,1); renderToday(); }
  else return;
  e.preventDefault();
});

/* ═══════════════════════════════════════════════════════════════
   WIRE — TODAY
   ═══════════════════════════════════════════════════════════════ */
const HOUR_PILLARS = {growth:1, cfa:1, sleep:1};

function wireToday(){
  $("#dPrev").onclick = ()=>{ cursor = addDays(cursor,-1); renderToday(); };
  $("#dNext").onclick = ()=>{ if(cursor < todayISO()){ cursor = addDays(cursor,1); renderToday(); } };
  if($("#dToday")) $("#dToday").onclick = ()=>{ cursor = todayISO(); buzz(8); renderToday(); };

  /* The label opens the picker natively on iOS and Android; showPicker covers
     the desktop browsers where a hidden input would otherwise do nothing. */
  const dj = $("#dateJumpIn");
  if(dj){
    dj.onchange = ()=>{
      const v = dj.value;
      if(!v) return;
      cursor = v > todayISO() ? todayISO() : v;
      buzz(8); renderToday();
    };
    const lbl = $("#v-today .datechip[for='dateJumpIn']");
    if(lbl) lbl.onclick = e=>{
      if(typeof dj.showPicker !== "function") return;      /* let the label do it */
      e.preventDefault();
      try{ dj.showPicker(); }catch(err){ dj.focus(); }
    };
  }

  const v = $("#v-today");
  v.querySelectorAll("[data-done]").forEach(b=>b.onclick = e=>{
    e.stopPropagation();
    const k = b.dataset.done, l = raw(cursor);
    if(k === "run") l.runDone = !l.runDone; else l.liftDone = !l.liftDone;
    saveLogs(); buzz(12); popNext = k;
    toast((k === "run" ? "Run " : "Session ") + ((k==="run"?l.runDone:l.liftDone) ? "done" : "un-marked"));
    renderToday();
  });
  const rb = v.querySelector('[data-open="run"]');
  if(rb) rb.onclick = ()=>{ logTab = "run"; go("log"); };
  const eb = v.querySelector("[data-exp]");
  if(eb) eb.onclick = ()=>{
    liftOpen = !liftOpen;
    $("#liftExp").classList.toggle("open", liftOpen);
    $("#liftRow").classList.toggle("isopen", liftOpen);
  };
  v.querySelectorAll("[data-openlog]").forEach(b=>b.onclick = ev=>{
    ev.stopPropagation(); logTab = b.dataset.openlog; go("log"); });

  v.querySelectorAll("[data-ex]").forEach(b=>b.onclick = ()=>{
    const name = b.dataset.ex, l = raw(cursor);
    l.lift = l.lift || {exercises:[]};
    let rec = l.lift.exercises.find(x=>x.name === name);
    if(!rec){ rec = {name, sets:null, reps:null, weight_kg:null, completed:false}; l.lift.exercises.push(rec); }
    rec.completed = !rec.completed;
    b.classList.toggle("on", rec.completed);
    const pres = liftExercises(buildDay(cursor).strength.planned);
    if(pres.length && pres.every(e=>l.lift.exercises.some(x=>x.name===e.n && x.completed))) l.liftDone = true;
    saveLogs(); buzz(8);
  });

  v.querySelectorAll("[data-feel]").forEach(b=>b.onclick = ()=>{
    const l = raw(cursor), val = +b.dataset.feel;
    l.feel = (l.feel === val) ? 0 : val;
    saveLogs(); buzz(6);
    v.querySelectorAll("[data-feel]").forEach(x=>
      x.setAttribute("aria-pressed", String(+x.dataset.feel === l.feel)));
  });
  const ns = $("#noteSave");
  if(ns) ns.onclick = ()=>{
    raw(cursor).note = $("#dayNote").value.trim();
    saveLogs(); buzz(8); toast("Note saved");
  };

  const pl = $("#pillars");
  if(pl) pl.addEventListener("click", e=>{
    const btn = e.target.closest("[data-step]"); if(!btn) return;
    const stp = btn.closest(".stp"), k = stp.dataset.p;
    if(!HOUR_PILLARS[k]) return;
    const l = raw(cursor), target = parseFloat(stp.dataset.target);
    const before = l.hours[k] || 0;
    const after = Math.max(0, Math.round((before + parseFloat(btn.dataset.step))*4)/4);
    if(after === before) return;
    l.hours[k] = after; saveLogs(); buzz(6);

    const pill = stp.closest(".pill");
    stp.querySelector(".v b").textContent = r1(after);
    pill.querySelector(".pd").textContent = r1(after)+" of "+target+" hours";
    pill.querySelector(".prg").style.width = Math.min(100, target ? after/target*100 : 0)+"%";
    const met = after >= target;
    pill.classList.toggle("done", met);
    if(met && before < target){
      const tk = pill.querySelector(".tick");
      tk.classList.add("pop"); setTimeout(()=>tk.classList.remove("pop"), 460);
      buzz(18);
      toast(buildDay(cursor).hard75.all_pillars_met ? "All four pillars closed" : "Pillar closed");
    }
  });
}

/* ═══════════════════════════════════════════════════════════════
   WIRE — LOG
   ═══════════════════════════════════════════════════════════════ */
function wireLog(){
  $$("#logTabs button").forEach(b=>b.onclick = ()=>{ logTab = b.dataset.lt; renderLog(); });
  ({food:wireFood, run:wireRun, lift:wireLift, body:wireBody, hours:wireHours}[logTab] || (()=>{}))();
}

function wireFood(){
  const q = $("#fq"), res = $("#fres"), g = $("#fg"), prev = $("#fprev"), por = $("#portions");
  function list(){
    const term = q.value.trim().toLowerCase();
    const items = (term ? allFoods().filter(f=>f.n.toLowerCase().includes(term)) : allFoods()).slice(0,9);
    res.innerHTML = items.map(f=>'<button class="fr2'+(pickedFood&&pickedFood.id===f.id?" sel":"")+'" data-f="'+f.id+'">'+
      '<div><div class="a">'+esc(f.n)+'</div><div class="b">'+f.p+'p · '+f.c+'c · '+f.f+'f</div></div>'+
      '<span class="k">'+f.kcal+'</span></button>').join("");
    res.querySelectorAll("[data-f]").forEach(b=>b.onclick = ()=>{
      pickedFood = allFoods().find(f=>f.id === b.dataset.f); list(); portions(); pre(); g.focus(); });
  }
  function portions(){
    if(!pickedFood || !pickedFood.u){ por.innerHTML = ""; return; }
    por.innerHTML = '<div class="chips">'+pickedFood.u.map(u=>
      '<button data-g="'+u[1]+'">'+esc(u[0])+' · '+u[1]+' g</button>').join("")+'</div>';
    por.querySelectorAll("[data-g]").forEach(b=>b.onclick = ()=>{ g.value = b.dataset.g; pre(); buzz(6); });
  }
  function pre(){
    const gr = parseFloat(g.value);
    if(!pickedFood){ prev.textContent = "Pick a food first."; return; }
    if(!gr){ prev.textContent = pickedFood.n+" selected. Enter grams, or tap a portion."; return; }
    const k = gr/100;
    prev.innerHTML = '<span class="amb mono">'+r0(pickedFood.kcal*k)+' kcal</span> · '+r1(pickedFood.p*k)+
      ' p · '+r1(pickedFood.c*k)+' c · '+r1(pickedFood.f*k)+' f';
  }
  q.oninput = list; g.oninput = pre; list(); portions(); pre();

  const qk = $("#quick");
  if(qk) qk.querySelectorAll("[data-q]").forEach(b=>b.onclick = ()=>{
    const f = allFoods().find(x=>x.n === b.dataset.q);
    if(!f) return toast("That food is no longer in your list");
    pickedFood = f; q.value = ""; g.value = b.dataset.g; list(); portions(); pre(); buzz(6);
  });

  $("#fadd").onclick = ()=>{
    const gr = parseFloat(g.value);
    if(!pickedFood) return toast("Pick a food first");
    if(!gr || gr <= 0) return toast("Enter grams");
    const k = gr/100;
    raw(cursor).food.push({food:pickedFood.n, grams:gr, kcal:pickedFood.kcal*k,
      protein:pickedFood.p*k, carbs:pickedFood.c*k, fat:pickedFood.f*k,
      time:new Date().toTimeString().slice(0,5)});
    saveLogs(); buzz(10); toast(r0(pickedFood.kcal*k)+" kcal added");
    g.value = ""; renderLog();
  };
  $("#flist").addEventListener("click", e=>{
    const b = e.target.closest("[data-del]"); if(!b) return;
    b.closest(".ent").classList.add("rm");
    setTimeout(()=>{ raw(cursor).food.splice(+b.dataset.del,1); saveLogs(); renderLog(); }, 230);
  });
  $("#nfsave").onclick = ()=>{
    const n = $("#nfn").value.trim(), kcal = parseFloat($("#nfk").value);
    if(!n || !isFinite(kcal)) return toast("Name and kcal are required");
    CUSTOM_FOODS.push({id:"c"+Date.now(), n, kcal, p:parseFloat($("#nfp").value)||0,
      c:parseFloat($("#nfc").value)||0, f:parseFloat($("#nff").value)||0});
    saveFoods(); toast(n+" saved"); renderLog();
  };
}

function wireRun(){
  const km = $("#rkm"), min = $("#rmin");
  const upd = ()=>{ const k = parseFloat(km.value), m = parseFloat(min.value);
    $("#rpace").innerHTML = (k>0 && m>0) ? '<span class="amb mono">'+paceStr(m/k)+' /km</span> average'
      : "Distance and duration give you the pace."; };
  km.oninput = upd; min.oninput = upd; upd();
  $("#rsave").onclick = ()=>{
    const k = parseFloat(km.value), m = parseFloat(min.value);
    if(!k || k <= 0) return toast("Distance is required");
    const l = raw(cursor);
    l.run = {distance_km:k, duration_min:m||null, avg_pace:(k&&m)?r1(m/k):null,
      avg_hr:parseFloat($("#rhr").value)||null, feel:$("#rfeel").value, notes:$("#rnote").value.trim()};
    l.runDone = true; saveLogs(); buzz(12);
    toast("Run saved · "+(m ? paceStr(m/k)+" /km" : k+" km")); renderLog();
  };
  if($("#rclear")) $("#rclear").onclick = ()=>{
    const l = raw(cursor); l.run = null; l.runDone = false; saveLogs(); toast("Cleared"); renderLog(); };
}

function wireLift(){
  $$("#logBody [data-tick]").forEach(b=>b.onclick = ()=>{ b.classList.toggle("on"); buzz(6); });
  if($("#lsave")) $("#lsave").onclick = ()=>{
    const ex = $$("#logBody .lrow").map(r=>({
      name:r.dataset.ex,
      sets:parseFloat(r.querySelector(".i-s").value)||null,
      reps:r.querySelector(".i-r").value.trim()||null,
      weight_kg:parseFloat(r.querySelector(".i-w").value)||null,
      completed:r.querySelector("[data-tick]").classList.contains("on")
    })).filter(x=>x.sets||x.reps||x.weight_kg||x.completed);
    const l = raw(cursor); l.lift = {exercises:ex};
    if(ex.length && ex.every(x=>x.completed)) l.liftDone = true;
    saveLogs(); toast(ex.length+" exercises saved"); renderLog();
  };
  if($("#ldone")) $("#ldone").onclick = ()=>{
    const l = raw(cursor); l.liftDone = !l.liftDone; saveLogs(); buzz(12);
    toast(l.liftDone ? "Session complete" : "Marked not done"); renderLog(); };
  if($("#exadd")) $("#exadd").onclick = ()=>{
    const n = $("#exq").value.trim(); if(!n) return toast("Name the exercise");
    const l = raw(cursor); l.lift = l.lift || {exercises:[]};
    if(l.lift.exercises.some(x=>x.name === n)) return toast("Already on this day's list");
    l.lift.exercises.push({name:n, sets:null, reps:null, weight_kg:null, completed:false});
    saveLogs(); renderLog();
  };
  wireGym();
}

function wireGym(){
  const g = gymFor(cursor);

  const sel = $("#gPreset");
  if(sel) sel.onchange = ()=>{
    g.preset = sel.value; gymEx = null; gymCat = "All"; saveGym(); renderLog();
  };
  const nb = $("#gNewPreset");
  if(nb) nb.onclick = ()=>{
    gymBuilding = true; gymDraft = new Set(); gymEx = null; gymCat = "All"; renderLog();
  };
  if($("#gCancelPreset")) $("#gCancelPreset").onclick = ()=>{ gymBuilding = false; renderLog(); };
  if($("#gSavePreset")) $("#gSavePreset").onclick = ()=>{
    const nm = $("#gPresetName").value.trim();
    if(!nm) return toast("Give the routine a name");
    if(!gymDraft.size) return toast("Tap at least one exercise");
    SETTINGS.presets[nm] = Array.from(gymDraft);
    saveSettings(); gymBuilding = false; g.preset = nm; saveGym();
    toast("Routine saved"); renderLog();
  };

  $$("#logBody .catpill").forEach(b=>b.onclick = ()=>{ gymCat = b.dataset.cat; renderLog(); });

  $$("#gGrid [data-gex]").forEach(b=>b.onclick = ()=>{
    const n = b.dataset.gex;
    if(gymBuilding){
      if(gymDraft.has(n)) gymDraft.delete(n); else gymDraft.add(n);
      renderLog();
    } else {
      gymEx = (gymEx === n) ? null : n;
      renderLog();
      const f = $("#gForm");
      if(f) f.scrollIntoView({behavior:"smooth", block:"center"});
    }
  });

  if($("#gLog")) $("#gLog").onclick = ()=>{
    const s = parseInt($("#gSet").value), w = parseFloat($("#gW").value);
    const reps = $("#gR").value.trim(), rpe = parseFloat($("#gRpe").value);
    if(!w && !reps) return toast("A weight or some reps, at least");
    g.sets.push({id:"g"+Date.now(), name:gymEx, s:isNaN(s)?null:s,
      w:isNaN(w)?null:w, r:reps, rpe:isNaN(rpe)?null:rpe});
    g.preset = g.preset || ($("#gPreset") ? $("#gPreset").value : "");
    saveGym(); buzz(10); toast("Set logged");
    const l = raw(cursor);
    if(!l.liftDone && g.sets.length >= 4){ /* leave the tick to you — just nudge */ }
    renderLog();
    const f = $("#gForm"); if(f) f.scrollIntoView({behavior:"smooth", block:"center"});
  };

  $$("#gLogList [data-gdel]").forEach(b=>b.onclick = ()=>{
    g.sets = g.sets.filter(x=>x.id !== b.dataset.gdel);
    if(!g.sets.length && !g.preset) delete GYM[cursor];
    saveGym(); renderLog();
  });
}

function wireBody(){
  $("#wsave").onclick = ()=>{
    const v = parseFloat($("#wkg").value);
    if(!v || v < 30 || v > 250) return toast("That isn't a weight in kg");
    raw(cursor).weight_kg = r1(v); saveLogs(); buzz(10);
    const a = rollingWeight(cursor,7);
    toast(a != null ? "Saved · avg "+a+" kg" : "Saved"); renderLog();
  };
}
function wireHours(){
  $("#hsave").onclick = ()=>{
    const l = raw(cursor);
    $$(".hin").forEach(i=>{ l.hours[i.dataset.h] = Math.max(0, parseFloat(i.value)||0); });
    saveLogs(); buzz(10);
    const d = buildDay(cursor);
    toast(d.hard75.all_pillars_met ? "All four pillars closed"
      : d.hard75.pillars.filter(p=>p.met).length+" of 4 closed");
    renderLog();
  };
}

/* ═══════════════════════════════════════════════════════════════
   WIRE — PLAN
   ═══════════════════════════════════════════════════════════════ */
function wirePlan(){
  $$("#planTabs button").forEach(b=>b.onclick = ()=>{ planTab = b.dataset.pt; openWeek = null; renderPlan(); });
  $$("#planBody [data-week]").forEach(b=>b.onclick = ()=>{
    const n = +b.dataset.week; openWeek = openWeek === n ? null : n; renderPlan(); });
  $$("#planBody .acch").forEach(b=>b.onclick = ()=>b.parentElement.classList.toggle("open"));
}

/* ═══════════════════════════════════════════════════════════════
   WIRE — SETTINGS
   ═══════════════════════════════════════════════════════════════ */
function backupPayload(){
  return JSON.stringify({app:"block", v:3, exported:new Date().toISOString(),
    logs:LOGS, settings:SETTINGS, customFoods:CUSTOM_FOODS, gym:GYM}, null, 2);
}
function markExported(){ SETTINGS.lastExport = Date.now(); saveSettings(); renderGlobalWarn(); }

function wireSettings(){
  $("#shClose").onclick = closeSettings;
  $("#setSave").onclick = ()=>{
    const n = (id,f)=>{ const v = parseFloat($(id).value); return isFinite(v) ? v : f; };
    SETTINGS.raceDate = $("#sRace").value || SETTINGS.raceDate;
    SETTINGS.blockStart = $("#sBlock").value || SETTINGS.blockStart;
    SETTINGS.hardStart = $("#sHard").value || SETTINGS.hardStart;
    SETTINGS.hardLength = Math.max(1, n("#sHardLen", SETTINGS.hardLength));
    SETTINGS.startWeight = n("#sStartW", SETTINGS.startWeight);
    SETTINGS.targetWeight = n("#sTargetW", SETTINGS.targetWeight);
    SETTINGS.targetWeightDate = $("#sTargetD").value || SETTINGS.targetWeightDate;
    SETTINGS.tdeeFactor = n("#sTdee", SETTINGS.tdeeFactor);
    SETTINGS.deficit = n("#sDef", SETTINGS.deficit);
    SETTINGS.proteinPerKg = n("#sPro", SETTINGS.proteinPerKg);
    SETTINGS.fatPerKg = n("#sFat", SETTINGS.fatPerKg);
    SETTINGS.growthTarget = n("#sGrowth", SETTINGS.growthTarget);
    SETTINGS.cfaWeekday = n("#sCfaWd", SETTINGS.cfaWeekday);
    SETTINGS.cfaWeekend = n("#sCfaWe", SETTINGS.cfaWeekend);
    SETTINGS.sleepTarget = n("#sSleep", SETTINGS.sleepTarget);
    SETTINGS.eveningHour = Math.min(23, Math.max(0, n("#sEve", SETTINGS.eveningHour)));
    SETTINGS.autoWeather = $("#sAuto").value === "1";
    SETTINGS.manualDew = n("#sDew", SETTINGS.manualDew);
    saveSettings(); toast("Saved"); closeSettings(); render();
    if(SETTINGS.autoWeather && !WEATHER) loadWeather();
  };
  $$("#sheetBody [data-pdel]").forEach(b=>b.onclick = ()=>{
    delete SETTINGS.presets[b.dataset.pdel]; saveSettings(); toast("Routine removed"); openSettings();
  });
  $("#expBtn").onclick = async ()=>{
    const text = backupPayload(), name = "block-"+todayISO()+".json";
    try{
      const file = new File([text], name, {type:"application/json"});
      if(navigator.canShare && navigator.canShare({files:[file]})){
        await navigator.share({files:[file], title:name});
        markExported(); toast("Backed up"); return;
      }
    }catch(e){ if(e && e.name === "AbortError") return; }
    try{
      const blob = new Blob([text], {type:"application/json"});
      const url = URL.createObjectURL(blob), a = document.createElement("a");
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 3000);
      markExported(); toast("Saved to Files");
    }catch(e){ toast("Download blocked — use Copy as text"); }
  };
  $("#copyBtn").onclick = async ()=>{
    const text = backupPayload();
    try{
      await navigator.clipboard.writeText(text);
      markExported(); toast("Copied — paste it into Notes or an email");
    }catch(e){
      const ta = document.createElement("textarea"); ta.value = text;
      ta.style.cssText = "position:fixed;top:0;left:0;opacity:0";
      document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
      const ok = document.execCommand("copy"); ta.remove();
      if(ok){ markExported(); toast("Copied to clipboard"); } else toast("Couldn't copy");
    }
  };
  $("#impBtn").onclick = ()=>{
    const i = document.createElement("input"); i.type = "file"; i.accept = "application/json,.json";
    i.onchange = ()=>{
      const f = i.files && i.files[0]; if(!f) return;
      const r = new FileReader();
      r.onload = ()=>{ try{
        const j = JSON.parse(r.result);
        if(!j.logs || typeof j.logs !== "object") throw 0;
        LOGS = Object.assign({}, LOGS, j.logs);
        if(j.settings) SETTINGS = Object.assign({}, SETTINGS, j.settings);
        if(Array.isArray(j.customFoods)) CUSTOM_FOODS = j.customFoods;
        if(j.gym) GYM = Object.assign({}, GYM, j.gym);
        storage.set(K.logs, LOGS); saveSettings(); saveFoods(); saveGym();
        toast("Backup restored"); closeSettings(); render();
      }catch(e){ toast("That isn't a Block backup"); } };
      r.readAsText(f);
    };
    i.click();
  };
  $("#wipeBtn").onclick = ()=>{
    if(!confirm("Erase every logged day, setting, routine and custom food? This cannot be undone.")) return;
    LOGS = {}; CUSTOM_FOODS = []; GYM = {};
    SETTINGS = Object.assign({}, DEFAULT_SETTINGS, {presets:JSON.parse(JSON.stringify(DEFAULT_PRESETS))});
    storage.set(K.logs, LOGS); saveSettings(); saveFoods(); saveGym();
    cursor = todayISO(); toast("Erased"); closeSettings(); render();
  };
}

/* ═══════════════════════════════════════════════════════════════
   INIT
   ═══════════════════════════════════════════════════════════════ */
loadAll();
const migrated = importLegacy();
if(SETTINGS.theme){
  document.documentElement.dataset.theme = SETTINGS.theme;
  document.querySelector('meta[name="theme-color"]')
    .setAttribute("content", SETTINGS.theme === "dark" ? "#0B0B0C" : "#E9E3D6");
} else if(window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches){
  document.documentElement.dataset.theme = "light";
  document.querySelector('meta[name="theme-color"]').setAttribute("content", "#E9E3D6");
}
cursor = todayISO();
go("today");
loadWeather();
if(!STORAGE_OK) toast("This browser is blocking storage — nothing will save");
else if(migrated && (migrated.days || migrated.foods || migrated.sets))
  setTimeout(()=>toast("Imported "+migrated.days+" days from your old tracker"), 900);

document.addEventListener("visibilitychange", ()=>{
  if(document.visibilityState !== "visible") return;
  if(view === "today" && daysBetween(cursor, todayISO()) === 1){ cursor = todayISO(); render(); }
  if(WEATHER && Date.now() - WEATHER.at > 2*3600*1000) loadWeather();
});

</script>
